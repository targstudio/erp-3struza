<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>*{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

</head><body>
<title>ERP 3STRUZA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar grafite fixa com a marca + área de trabalho clara com cabeçalho, filtros de mês e tabelas operacionais */
:root{
  --brand:#0B419E; --graphite:#30363C;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F8FB; --fg:#1A1F26; --muted:#6B7380; --line:#E6EAF0;
  --accent:#0B419E; --accent-hover:#08357F; --on-accent:#FFFFFF; --accent-soft:#EAF1FD; --notice:#F2F7FF; --notice-line:#C9DBF7;
  --side:#FFFFFF; --side-fg:#3A414B; --side-active:#EAF1FD; --side-icon:#7A828D;
  --pos:#1E8449; --pos-soft:#E5F4EB; --neg:#C0392B; --neg-soft:#FBEAE8; --warn:#A86A0C; --warn-soft:#FBF1DF;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --logo-l:block; --logo-d:none;
  --g-blue:linear-gradient(135deg,#3B8BEB 0%,#0B419E 100%);
  --g-graph:linear-gradient(135deg,#8B5CF6 0%,#4F46E5 100%);
  --g-green:linear-gradient(135deg,#3DAA7A 0%,#1F6F57 100%);
}
:root{color-scheme:light}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.r,.kpi b{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100%}

/* sidebar */
.side{background:var(--side);color:var(--side-fg);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{padding:20px 20px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.side .logo .mark{width:46px;height:46px;border-radius:50%;background:var(--g-blue);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 8px rgba(11,65,158,.25)}
.side .logo .mark img{width:28px;height:auto}
.side .logo .nm{display:flex;flex-direction:column;gap:5px;min-width:0}
.side .logo .nm img{width:128px;max-width:100%}
.side .logo .lg-l{display:var(--logo-l)} .side .logo .lg-d{display:var(--logo-d)}
.side .logo small{font-size:13px;color:var(--muted);white-space:nowrap}
.nav-sep{height:1px;background:var(--line);margin:8px 4px}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.nav-group{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 12px 6px}
.nav-group:first-child{padding-top:4px}
.nav a{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:11px;color:var(--side-fg);text-decoration:none;font-weight:500;font-size:15.5px;cursor:pointer}
.nav a svg{color:var(--side-icon)}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--side-active);color:var(--accent)}
.nav a.on svg{color:var(--accent)}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;background:#E5484D;color:#fff;font-size:11.5px;font-weight:700;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;border-radius:11px}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:10px;background:var(--g-blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.side .foot b{display:block;font-size:14.5px;color:var(--fg)}
.side .foot small{font-size:12.5px;color:var(--muted)}
.side .foot .chev{margin-left:auto;width:18px;height:18px;color:var(--muted);flex:none}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:14px}
.datepill{margin-left:auto;display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:500;font-size:14.5px;background:var(--surface);box-shadow:var(--shadow)}
.datepill svg{width:18px;height:18px;color:var(--muted)}
.sec-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.sec-h h2{font-size:28px;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sec-h p{margin:4px 0 0;color:var(--muted);font-size:15px}
.sec-h .actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.sec-h .actions .btn:not(.pri){background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.sec-h .actions .btn:not(.pri):hover{border-color:var(--accent)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:7px;padding:6px 8px;cursor:pointer}
.content{padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-hover);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.soft:hover{border-color:var(--accent)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.danger{color:var(--neg)}
.btn.danger:hover{border-color:var(--neg)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600}

.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative;min-width:0}
.kpi span{font-size:15px;color:var(--muted);font-weight:500}
.kpi b{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:13.5px}
.kpi .ic{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.kpi .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi .ic.w{background:var(--warn-soft);color:var(--warn)} .kpi .ic.n{background:var(--neg-soft);color:var(--neg)} .kpi .ic.p{background:var(--pos-soft);color:var(--pos)}
.kpi.hl{background:var(--g-blue);border-color:transparent;color:#fff;overflow:hidden}
.kpi.hl span,.kpi.hl small{color:#fff;opacity:.88}
.heroes{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.hero{border-radius:18px;padding:24px 26px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:230px;min-width:0}
.hero::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.09);top:-70px;right:-50px}
.hero.blue{background:var(--g-blue)} .hero.graph{background:var(--g-graph)} .hero.green{background:var(--g-green)}
.hero h3{margin:0;font-size:16px;font-weight:600;position:relative}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1;position:relative;font-variant-numeric:tabular-nums}
.hero .ic{position:absolute;top:22px;right:22px;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.hero .ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero .chip{align-self:flex-start;background:rgba(255,255,255,.18);border-radius:20px;padding:3px 12px;font-size:13px;font-weight:500}
.hero .meta{font-size:14.5px;opacity:.9}
.hero h3,.hero .big,.hero .meta,.hero .chip,.hero .foot{position:relative}
.hero .foot{margin-top:6px;border-top:1px solid rgba(255,255,255,.25);padding-top:12px;font-size:14px;opacity:.92}
.hero svg.spark{width:100%;height:auto;display:block;margin-top:auto}
.hero svg.spark text{fill:rgba(255,255,255,.8);font-size:10px;font-family:var(--f-body)}
.notice{background:var(--notice);border:1px solid var(--notice-line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.notice h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.notice h3 svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.notice .nrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.notice .nrow .t{flex:1;min-width:200px;font-size:15px}
.btn.dark{background:#30363C;border-color:#30363C;color:#fff}
.btn.dark:hover{background:#1F2328;color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:500}
.btn.ghost:hover{color:var(--fg);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px;font-weight:600;margin:0}
.card-h .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-b{padding:16px 18px}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right;white-space:nowrap}
td.acts{white-space:nowrap;text-align:right}
td .muted,.muted{color:var(--muted)}
tfoot td{font-weight:700;background:var(--surface-2)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.p-ok{background:var(--pos-soft);color:var(--pos)}
.p-late{background:var(--neg-soft);color:var(--neg)}
.p-open{background:var(--warn-soft);color:var(--warn)}
.p-info{background:var(--accent-soft);color:var(--accent)}
.p-grey{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.month{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--surface);overflow:hidden}
.month button{background:none;border:0;padding:7px 11px;cursor:pointer;font-size:16px;line-height:1}
.month button:hover{color:var(--accent)}
.month span{min-width:132px;text-align:center;font-weight:600;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
input.search,select.f{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--surface);min-width:0}

/* contas cards */
.accts{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.acct{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.acct .t{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.acct .n{font-weight:600}
.acct b{font-family:var(--f-display);font-size:24px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-banco{background:var(--accent)} .d-gaveta{background:var(--pos)} .d-credito{background:var(--warn)}

/* estoque */
.stock{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sc h3{margin:0;font-family:var(--f-display);font-size:17px}
.sc b{font-family:var(--f-display);font-size:26px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:6px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(12,16,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{max-width:980px}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-family:var(--f-display);font-size:21px}
.modal-h .x{margin-left:auto;background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.fl input,label.fl select,label.fl textarea,.items input,.items select{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface);color:var(--fg);font-weight:400;font-size:14.5px;width:100%;min-width:0}
label.fl textarea{min-height:64px;resize:vertical}
.chk{display:flex;gap:16px;flex-wrap:wrap}
.chk label{display:flex;align-items:center;gap:6px;font-weight:500;cursor:pointer}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opts input{accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.box{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.items{width:100%;border-collapse:collapse}
.items th{background:none;padding:4px 6px;border:0}
.items td{padding:4px 6px;border:0;vertical-align:top}
.items tr:hover td{background:none}
.items .avail{font-size:11.5px;color:var(--muted);padding-top:3px}
.items .avail.low{color:var(--neg)}
.total-line{display:flex;justify-content:flex-end;gap:24px;font-weight:700;font-size:16px;flex-wrap:wrap}
.total-line span{font-weight:500;color:var(--muted);font-size:13px;margin-right:6px}
.err{color:var(--neg);font-size:13.5px;font-weight:600}

.login{position:fixed;inset:0;z-index:70;background:linear-gradient(160deg,#F4F8FF 0%,#FFFFFF 60%);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(11,65,158,.12);padding:32px;display:flex;flex-direction:column;gap:14px}
.login-mark{width:56px;height:56px;border-radius:50%;background:var(--g-blue);display:flex;align-items:center;justify-content:center}
.login-mark img{width:34px}
.login-logo{width:170px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#30363C;color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--line);border-radius:9px;padding:10px 14px;font-size:14px;font-weight:500}

.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .d{font-size:12.5px;color:var(--muted);width:64px;flex:none}
.li .m{min-width:0;flex:1}
.li .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font-weight:700;white-space:nowrap}

.scrim{display:none}
@media (max-width:980px){
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1100px){
  .app{grid-template-columns:224px minmax(0,1fr)}
  .side .logo{padding:16px 14px}
  .side .logo .nm img{width:108px}
  .top,.content{padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
  .hero .big{font-size:30px}
}
@media (max-width:600px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .2s;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
  .burger{display:inline-flex}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top h1{font-size:19px}
  .datepill{display:none}
  .sec-h h2{font-size:23px}
  .sec-h .actions{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

<script>
/* ===================== utilidades ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fkg=n=>(Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:1})+' kg';
const fnum=(n,d=2)=>(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d});
const num=v=>{if(typeof v==='number')return v;v=String(v??'').trim().replace(/[R$\s]/g,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');const n=parseFloat(v);return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const fd=s=>s?s.split('-').reverse().join('/'):'—';
const fdShort=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const mLabel=ym=>MESES[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const mShort=ym=>MESES[+ym.slice(5,7)-1].slice(0,3);
function addMonths(s,n){const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(Math.min(d,last))}
function addDays(s,n){const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())}
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ICON={
  painel:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  caixa:'<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/>',
  pagar:'<path d="M12 19V5M5 12l7 7 7-7"/>',
  receber:'<path d="M12 5v14M5 12l7-7 7 7"/>',
  compras:'<path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',
  vendas:'<path d="M20 12V8l-8-5-8 5v8l8 5 4-2.5"/><path d="M4 8l8 5 8-5M12 13v8M17 17h5M19.5 14.5v5"/>',
  estoque:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  cadastros:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.5 3.5 5.2"/>',
  config:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const CORHEX={'Natural':'#EDE6D3','Branco':'#FFFFFF','Preto':'#1A1A1A','Azul':'#1F5FD1','Verde':'#2E8B57','Vermelho':'#C8322B','Amarelo':'#E7C021','Cinza':'#8C939C','Laranja':'#E57B22','Marrom':'#7A4E2D','Mista':'linear-gradient(135deg,#1F5FD1,#2E8B57 50%,#E7C021)','Transparente':'#E8F1F6'};
const swatch=c=>`<span class="swatch" style="background:${CORHEX[c]||'#bbb'}"></span>`;

/* ===================== dados ===================== */
const COLS=['contas','parceiros','movimentos','compras','vendas','titulos','ajustes','config'];
const S={};COLS.forEach(c=>S[c]=[]);
const DEF_CFG={
  tipos:['PP Moído','PP Granulado','PP Aglutinado','PP Aparas/Fardo'],
  cores:['Natural','Branco','Preto','Azul','Verde','Vermelho','Amarelo','Cinza','Laranja','Mista'],
  catPagar:['Compra de material','Aluguel','Energia elétrica','Água','Salários','Frete','Manutenção','Impostos','Combustível','Internet/Telefone','Contador','Outros'],
  catReceber:['Venda de material','Serviço de moagem','Empréstimo','Outros'],
  pesoSaco:25,pesoBag:1000
};
let MODE='loading',DB=null,loaded=new Set();
const cfg=()=>Object.assign({},DEF_CFG,(S.config.find(c=>c.id==='geral')||{}));
const byId=(col,id)=>S[col].find(x=>x.id===id);
const contaNome=id=>byId('contas',id)?.nome||'—';
const parcNome=id=>byId('parceiros',id)?.nome||'—';

function loadLocal(){try{const raw=localStorage.getItem('3struza-erp');if(raw){const o=JSON.parse(raw);COLS.forEach(c=>S[c]=o[c]||[])}}catch(e){}}
function saveLocal(){try{localStorage.setItem('3struza-erp',JSON.stringify(S))}catch(e){}}

function upsertLocal(col,obj){const i=S[col].findIndex(x=>x.id===obj.id);if(i>=0)S[col][i]=obj;else S[col].push(obj)}
async function put(col,obj){
  const {id,...data}=obj;
  if(MODE==='supa'){upsertLocal(col,obj);schedule();const{error}=await SB.from('docs').upsert({col,id,data,updated_at:new Date().toISOString()});if(error)throw error;return}
  if(MODE==='db'){await DB.collection(col).doc(id).set(data)}
  else{const i=S[col].findIndex(x=>x.id===id);if(i>=0)S[col][i]=obj;else S[col].push(obj);saveLocal();render()}
}
async function del(col,id){
  if(MODE==='supa'){S[col]=S[col].filter(x=>x.id!==id);schedule();const{error}=await SB.from('docs').delete().eq('col',col).eq('id',id);if(error)throw error;return}
  if(MODE==='db'){await DB.collection(col).doc(id).delete()}
  else{S[col]=S[col].filter(x=>x.id!==id);saveLocal();render()}
}
let rq=null;function schedule(){if(rq)return;rq=requestAnimationFrame(()=>{rq=null;render()})}

/* ---- hospedagem própria: Supabase (window.SUPA_CFG vem de config.js) ---- */
let SB=null;
async function initSupa(){
  try{SB=window.supabase.createClient(window.SUPA_CFG.url,window.SUPA_CFG.key)}catch(e){$('#view').innerHTML='<div class="empty"><b>Não foi possível conectar ao banco</b>Confira o arquivo config.js.</div>';return}
  const{data:{session}}=await SB.auth.getSession();
  if(session)startSupa(session);else showLogin();
}
function showLogin(msg){MODE='login';const l=$('#login');l.hidden=false;$('#lgErr').textContent=msg||'';$('#lgErr').hidden=!msg;setTimeout(()=>$('#lgEmail').focus(),50)}
async function startSupa(session){
  $('#login').hidden=true;
  const u=session.user;const nome=(u.user_metadata&&u.user_metadata.nome)||u.email.split('@')[0];const first=nome.split(/[ .]/)[0];
  $('#hello').textContent='Olá, '+first.charAt(0).toUpperCase()+first.slice(1)+'!';$('#uname').textContent=nome;$('#av').textContent=first.charAt(0).toUpperCase();$('#urole').textContent=u.email;
  $('#foot').title='Sair';$('#foot').style.cursor='pointer';$('#foot').onclick=async()=>{if(await ask('Sair','Deseja sair do ERP?',[{label:'Sair',cls:'pri',v:true}])){await SB.auth.signOut();location.reload()}};
  const all=[];for(let from=0;;from+=1000){const{data,error}=await SB.from('docs').select('col,id,data').range(from,from+999);if(error){$('#view').innerHTML='<div class="empty"><b>Erro ao carregar dados</b>'+esc(error.message)+'</div>';return}all.push(...data);if(data.length<1000)break}
  COLS.forEach(c=>S[c]=[]);all.forEach(r=>{if(S[r.col])S[r.col].push({id:r.id,...r.data})});
  MODE='supa';COLS.forEach(c=>loaded.add(c));render();
  SB.channel('docs-rt').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    if(p.eventType==='DELETE'){const r=p.old;if(r&&S[r.col])S[r.col]=S[r.col].filter(x=>x.id!==r.id)}
    else{const r=p.new;if(r&&S[r.col])upsertLocal(r.col,{id:r.id,...r.data})}
    schedule()}).subscribe();
}
document.addEventListener('submit',async e=>{if(e.target.id!=='lgForm')return;e.preventDefault();
  const btn=e.target.querySelector('button');btn.disabled=true;$('#lgErr').hidden=true;
  const{data,error}=await SB.auth.signInWithPassword({email:$('#lgEmail').value.trim(),password:$('#lgPass').value});
  btn.disabled=false;if(error){showLogin(error.message==='Invalid login credentials'?'E-mail ou senha incorretos.':error.message);return}
  startSupa(data.session)});

async function initStore(){
  let db=null;
  try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db')}catch(e){db=null}
  if(db){
    DB=db;MODE='db';
    COLS.forEach(c=>{
      db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));loaded.add(c);schedule()},
        err=>{console.warn(c,err);loaded.add(c);schedule()});
    });
  }else{MODE='local';loadLocal();COLS.forEach(c=>loaded.add(c));render()}
}

function saldoConta(id){
  const c=byId('contas',id);let s=num(c?.saldoInicial);
  for(const m of S.movimentos){
    if(m.tipo==='entrada'&&m.contaId===id)s+=num(m.valor);
    else if(m.tipo==='saida'&&m.contaId===id)s-=num(m.valor);
    else if(m.tipo==='transferencia'){if(m.contaId===id)s-=num(m.valor);if(m.contaDestinoId===id)s+=num(m.valor)}
  }return r2(s)
}
const saldoTotal=()=>S.contas.filter(c=>c.ativo!==false).reduce((a,c)=>a+saldoConta(c.id),0);
const statusT=t=>t.pago?'pago':(t.vencimento<today()?'atrasado':'aberto');
const STATUS_PILL={pago:['p-ok','Pago'],atrasado:['p-late','Atrasado'],aberto:['p-open','Em aberto']};
function pillT(t){const s=statusT(t);const[k,l]=STATUS_PILL[s];return `<span class="pill ${k}">${t.lado==='receber'&&s==='pago'?'Recebido':l}</span>`}
const EMB={saco:'Saco',bigbag:'Big Bag',granel:'Granel'};
const FORMA={dinheiro:'Dinheiro',pix:'PIX',permuta:'Troca / Permuta',credito:'Crédito (a prazo)'};
const TIPOCONTA={banco:'Banco · C/C',gaveta:'Físico · Gaveta',credito:'Crédito com terceiro'};
const stockKey=it=>[it.tipo,it.cor,it.embalagem,it.embalagem==='granel'?0:num(it.pesoUn)].join('|');

function estoque(){
  const m=new Map();
  const ensure=it=>{const k=stockKey(it);if(!m.has(k))m.set(k,{key:k,tipo:it.tipo,cor:it.cor,embalagem:it.embalagem,pesoUn:it.embalagem==='granel'?0:num(it.pesoUn),kg:0,un:0});return m.get(k)};
  const custo=new Map();
  const addCusto=(it,kg,valor)=>{const k=it.tipo+'|'+it.cor;const c=custo.get(k)||{kg:0,v:0};c.kg+=kg;c.v+=valor;custo.set(k,c)};
  S.compras.forEach(c=>(c.itens||[]).forEach(it=>{const e=ensure(it);e.kg+=num(it.kg);e.un+=num(it.qtd);addCusto(it,num(it.kg),num(it.kg)*num(it.precoKg))}));
  S.ajustes.forEach(a=>{const e=ensure(a);const s=a.sentido==='saida'?-1:1;e.kg+=s*num(a.kg);e.un+=s*num(a.qtd);if(s>0&&num(a.custoKg))addCusto(a,num(a.kg),num(a.kg)*num(a.custoKg))});
  S.vendas.forEach(v=>(v.itens||[]).forEach(it=>{const e=ensure(it);e.kg-=num(it.kg);e.un-=num(it.qtd)}));
  const rows=[...m.values()].map(e=>{const c=custo.get(e.tipo+'|'+e.cor);e.custoKg=c&&c.kg?c.v/c.kg:0;e.valor=e.kg*e.custoKg;return e});
  rows.sort((a,b)=>a.tipo.localeCompare(b.tipo)||a.cor.localeCompare(b.cor)||a.embalagem.localeCompare(b.embalagem)||a.pesoUn-b.pesoUn);
  return rows;
}
function disponivel(it,ignoreVendaId){
  const k=stockKey(it);let kg=0;
  S.compras.forEach(c=>(c.itens||[]).forEach(x=>{if(stockKey(x)===k)kg+=num(x.kg)}));
  S.ajustes.forEach(a=>{if(stockKey(a)===k)kg+=(a.sentido==='saida'?-1:1)*num(a.kg)});
  S.vendas.forEach(v=>{if(v.id===ignoreVendaId)return;(v.itens||[]).forEach(x=>{if(stockKey(x)===k)kg-=num(x.kg)})});
  return kg;
}
function linked(refId){
  const tit=S.titulos.filter(t=>t.ref?.id===refId);
  const tids=new Set(tit.map(t=>t.id));
  const mov=S.movimentos.filter(m=>m.ref?.id===refId||tids.has(m.ref?.id));
  return{tit,mov};
}
async function removeLinked(refId){const{tit,mov}=linked(refId);for(const m of mov)await del('movimentos',m.id);for(const t of tit)await del('titulos',t.id)}
function genTitulos(base,modo,n,valor,venc){
  const grupo=nid();const out=[];
  if(modo==='unica'){out.push({...base,id:nid(),modo,grupo,parcela:1,totalParcelas:1,vencimento:venc,valor:r2(valor),pago:false})}
  else if(modo==='recorrente'){for(let i=0;i<n;i++)out.push({...base,id:nid(),modo,grupo,parcela:i+1,totalParcelas:n,vencimento:addMonths(venc,i),valor:r2(valor),pago:false})}
  else{const parc=Math.floor(valor/n*100)/100;let acc=0;for(let i=0;i<n;i++){const v=i===n-1?r2(valor-acc):parc;acc=r2(acc+parc);out.push({...base,id:nid(),modo,grupo,parcela:i+1,totalParcelas:n,vencimento:addMonths(venc,i),valor:v,pago:false})}}
  return out;
}

      <input class="search" id="busca" placeholder="Buscar…" value="${esc(UI.busca)}"></div></div>

/* ---------- Contas a pagar / receber ---------- */
function vTitulos(lado){
  const mes=UI.mes;const t=today();
  let list=S.titulos.filter(x=>x.lado===lado);
  const doMes=list.filter(x=>x.vencimento.slice(0,7)===mes);
  const atrasTodos=list.filter(x=>!x.pago&&x.vencimento<t);
  let rows=UI.filtroT==='atrasado'?atrasTodos:doMes;
  if(UI.filtroT==='aberto')rows=rows.filter(x=>!x.pago);
  if(UI.filtroT==='pago')rows=rows.filter(x=>x.pago);
  if(UI.busca){const q=UI.busca.toLowerCase();rows=rows.filter(x=>(x.descricao+' '+(x.categoria||'')+' '+parcNome(x.parceiroId)).toLowerCase().includes(q))}
  rows.sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
  const aberto=doMes.filter(x=>!x.pago).reduce((a,x)=>a+num(x.valor),0);
  const pago=doMes.filter(x=>x.pago).reduce((a,x)=>a+num(x.valor),0);
  const fixas=doMes.filter(x=>x.natureza==='fixa').reduce((a,x)=>a+num(x.valor),0);
  const verbo=lado==='pagar'?'Pagar':'Receber';
  const modoPill=x=>x.modo==='recorrente'?`<span class="pill p-info">Recorrente ${x.parcela}/${x.totalParcelas}</span>`:x.modo==='parcelada'?`<span class="pill p-info">Parcela ${x.parcela}/${x.totalParcelas}</span>`:'';
  return{sub:lado==='pagar'?'Despesas fixas, variáveis, recorrentes e parceladas':'Recebimentos únicos e parcelados',
    actions:`<button class="btn pri" data-act="novoTitulo" data-lado="${lado}">+ Nova conta a ${lado}</button>`,html:`
  <div class="grid kpis">
    <div class="kpi"><span>Em aberto em ${mShort(mes).toLowerCase()}</span><b class="${lado==='pagar'?'neg':'pos'}">${brl(aberto)}</b><small>${doMes.filter(x=>!x.pago).length} lançamento(s)</small></div>
    <div class="kpi"><span>${lado==='pagar'?'Pago':'Recebido'} em ${mShort(mes).toLowerCase()}</span><b>${brl(pago)}</b><small>${doMes.filter(x=>x.pago).length} lançamento(s)</small></div>
    ${lado==='pagar'?`<div class="kpi"><span>Contas fixas no mês</span><b>${brl(fixas)}</b><small>Variáveis/pontuais ${brl(doMes.reduce((a,x)=>a+num(x.valor),0)-fixas)}</small></div>`:''}
    <div class="kpi"><span>Atrasados (todos os meses)</span><b class="${atrasTodos.length?'neg':''}">${brl(atrasTodos.reduce((a,x)=>a+num(x.valor),0))}</b><small>${atrasTodos.length} lançamento(s)</small></div>
  </div>
  <div class="card">
    <div class="card-h"><div class="toolbar">${monthCtl()}<div class="seg">${[['todos','Todos'],['aberto','Em aberto'],['pago',lado==='pagar'?'Pagos':'Recebidos'],['atrasado','Atrasados']].map(([k,l])=>`<button data-act="filtroT" data-v="${k}" class="${UI.filtroT===k?'on':''}">${l}</button>`).join('')}</div></div>
      <div class="sp"><input class="search" id="busca" placeholder="Buscar…" value="${esc(UI.busca)}"></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th>${lado==='pagar'?'Fornecedor / favorecido':'Cliente / pagador'}</th><th>Categoria</th><th class="r">Valor</th><th>Situação</th><th></th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td class="num">${fd(x.vencimento)}</td><td>${esc(x.descricao)} ${modoPill(x)} ${lado==='pagar'?`<span class="pill p-grey">${x.natureza==='fixa'?'Fixa':'Variável'}</span>`:''}${x.pago?`<div class="muted" style="font-size:12.5px">${lado==='pagar'?'Pago':'Recebido'} em ${fd(x.pagoEm)} · ${esc(contaNome(x.contaId))}</div>`:''}</td>
      <td>${x.parceiroId?esc(parcNome(x.parceiroId)):'<span class="muted">—</span>'}</td><td class="muted">${esc(x.categoria||'')}</td><td class="r">${brl(x.valor)}</td><td>${pillT(x)}</td>
      <td class="acts">${x.pago?`<button class="btn sm" data-act="estornar" data-id="${x.id}">Estornar</button>`:`<button class="btn sm pri" data-act="baixar" data-id="${x.id}">${verbo}</button> <button class="btn sm" data-act="editTitulo" data-id="${x.id}">Editar</button>`} <button class="btn sm danger" data-act="delTitulo" data-id="${x.id}">Excluir</button></td></tr>`).join('')||`<tr><td colspan="7"><div class="empty"><b>Nada por aqui</b>${UI.filtroT==='atrasado'?'Nenhuma conta atrasada.':'Nenhuma conta com vencimento em '+mLabel(mes)+'.'}</div></td></tr>`}
    </tbody>${rows.length?`<tfoot><tr><td colspan="4">${rows.length} lançamento(s)</td><td class="r">${brl(rows.reduce((a,x)=>a+num(x.valor),0))}</td><td colspan="2"></td></tr></tfoot>`:''}</table></div>
  </div>`};
}

/* ---------- Compras / Vendas ---------- */
function vOps(col){
  const isC=col==='compras';const mes=UI.mes;
  let rows=S[col].filter(x=>x.data.slice(0,7)===mes);
  if(UI.busca){const q=UI.busca.toLowerCase();rows=rows.filter(x=>(parcNome(x.parceiroId)+' '+(x.itens||[]).map(i=>i.tipo+' '+i.cor).join(' ')+' '+(x.obs||'')).toLowerCase().includes(q))}
  rows.sort((a,b)=>b.data.localeCompare(a.data)||(b.numero||0)-(a.numero||0));
  const tot=rows.reduce((a,x)=>a+num(x.total),0),kgT=rows.reduce((a,x)=>a+num(x.totalKg),0);
  const porForma={};rows.forEach(x=>porForma[x.forma]=(porForma[x.forma]||0)+num(x.total));
  return{sub:isC?'Entrada de material comprado de fornecedores':'Saída de material vendido a clientes',
    actions:`<button class="btn pri" data-act="${isC?'novaCompra':'novaVenda'}">+ Nova ${isC?'compra':'venda'}</button>`,html:`
  <div class="grid kpis">
    <div class="kpi hl"><span>Total ${isC?'comprado':'vendido'} em ${mShort(mes).toLowerCase()}</span><b>${brl(tot)}</b><small>${rows.length} ${isC?'compra(s)':'venda(s)'}</small></div>
    <div class="kpi"><span>Peso</span><b>${fkg(kgT)}</b><small>${kgT?'Média '+brl(tot/kgT)+'/kg':'—'}</small></div>
    <div class="kpi"><span>Por forma de pagamento</span><small style="display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--fg)">${Object.keys(FORMA).map(k=>`<span style="display:flex;justify-content:space-between;gap:8px"><span class="muted">${FORMA[k]}</span><b class="num" style="font-size:14px;font-family:var(--f-body)">${brl(porForma[k]||0)}</b></span>`).join('')}</small></div>
  </div>
  <div class="card">
    <div class="card-h"><div class="toolbar">${monthCtl()}</div><div class="sp"><input class="search" id="busca" placeholder="Buscar ${isC?'fornecedor':'cliente'} ou material…" value="${esc(UI.busca)}"></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Nº</th><th>Data</th><th>${isC?'Fornecedor':'Cliente'}</th><th>Material</th><th class="r">Peso</th><th class="r">R$/kg</th><th class="r">Total</th><th>Pagamento</th><th></th></tr></thead><tbody>
    ${rows.map(x=>{const st=finStatus(x);return `<tr><td class="num muted">#${x.numero}</td><td class="num">${fd(x.data)}</td><td>${esc(parcNome(x.parceiroId))}</td>
      <td>${(x.itens||[]).map(i=>`<div style="white-space:nowrap">${swatch(i.cor)}${esc(i.tipo)} ${esc(i.cor)} <span class="muted">· ${i.embalagem==='granel'?'granel':fnum(i.qtd,0)+' '+EMB[i.embalagem].toLowerCase()+(num(i.qtd)>1?'s':'')+' de '+fnum(i.pesoUn,0)+' kg'}</span></div>`).join('')}</td>
      <td class="r">${fkg(x.totalKg)}</td><td class="r">${x.totalKg?brl(x.total/x.totalKg):'—'}</td><td class="r"><b>${brl(x.total)}</b></td>
      <td><div>${FORMA[x.forma]}${x.forma==='credito'?` · ${x.parcelas}x`:''}</div>${st}</td>
      <td class="acts"><button class="btn sm" data-act="editOp" data-col="${col}" data-id="${x.id}">Editar</button> <button class="btn sm danger" data-act="delOp" data-col="${col}" data-id="${x.id}">Excluir</button></td></tr>`}).join('')||`<tr><td colspan="9"><div class="empty"><b>Nenhuma ${isC?'compra':'venda'} em ${mLabel(mes)}</b>Use “+ Nova ${isC?'compra':'venda'}” para lançar.</div></td></tr>`}
    </tbody>${rows.length?`<tfoot><tr><td colspan="4">${rows.length} lançamento(s)</td><td class="r">${fkg(kgT)}</td><td class="r">${kgT?brl(tot/kgT):''}</td><td class="r">${brl(tot)}</td><td colspan="2"></td></tr></tfoot>`:''}</table></div>
  </div>`};
}
function finStatus(x){
  if(x.forma==='permuta')return `<span class="muted" style="font-size:12.5px">${esc(x.permutaDesc||'Sem movimento financeiro')}</span>`;
  if(x.forma==='credito'){const{tit}=linked(x.id);const p=tit.filter(t=>t.pago).length;return `<span class="pill ${p===tit.length&&tit.length?'p-ok':'p-open'}">${p}/${tit.length} ${x.lado==='vendas'||S.vendas.includes(x)?'recebidas':'pagas'}</span>`}
  return `<span class="muted" style="font-size:12.5px">${esc(contaNome(x.contaId))}</span>`;
}

/* ---------- Estoque ---------- */
function vEstoque(){
  let rows=estoque().filter(e=>Math.abs(e.kg)>0.0001||Math.abs(e.un)>0.0001);
  const all=rows;
  if(UI.estTipo)rows=rows.filter(e=>e.tipo===UI.estTipo);
  if(UI.estCor)rows=rows.filter(e=>e.cor===UI.estCor);
  const porTipo={};all.forEach(e=>{const p=porTipo[e.tipo]||(porTipo[e.tipo]={kg:0,valor:0,saco:0,bigbag:0,granel:0,cores:{}});p.kg+=e.kg;p.valor+=e.valor;p[e.embalagem]+=e.embalagem==='granel'?e.kg:e.un;p.cores[e.cor]=(p.cores[e.cor]||0)+e.kg});
  const maxT=Math.max(1,...Object.values(porTipo).map(p=>p.kg));
  const tipos=[...new Set(all.map(e=>e.tipo))],cores=[...new Set(all.map(e=>e.cor))];
  // kardex
  const kx=[];
  S.compras.forEach(c=>(c.itens||[]).forEach(it=>kx.push({data:c.data,o:'Compra #'+c.numero,p:parcNome(c.parceiroId),it,s:1})));
  S.vendas.forEach(c=>(c.itens||[]).forEach(it=>kx.push({data:c.data,o:'Venda #'+c.numero,p:parcNome(c.parceiroId),it,s:-1})));
  S.ajustes.forEach(a=>kx.push({data:a.data,o:'Ajuste',p:a.motivo||'',it:a,s:a.sentido==='saida'?-1:1,aj:a.id}));
  kx.sort((a,b)=>b.data.localeCompare(a.data));
  const totKg=rows.reduce((a,e)=>a+e.kg,0),totVal=rows.reduce((a,e)=>a+e.valor,0);
  return{sub:'Saldo por tipo de material, cor e embalagem',actions:`<button class="btn" data-act="ajuste">Ajuste / estoque inicial</button>`,html:`
  <div class="grid stock">${Object.entries(porTipo).map(([t,p])=>`<div class="sc"><h3>${esc(t)}</h3><b class="num ${p.kg<0?'neg':''}">${fkg(p.kg)}</b><div class="bar"><i style="width:${Math.max(0,p.kg)/maxT*100}%"></i></div>
    <div class="muted" style="font-size:13px">${[p.saco?fnum(p.saco,0)+' sacos':'',p.bigbag?fnum(p.bigbag,0)+' big bags':'',p.granel?fkg(p.granel)+' a granel':''].filter(Boolean).join(' · ')||'—'}</div>
    <div style="font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px">${Object.entries(p.cores).filter(([,v])=>Math.abs(v)>0.01).map(([c,v])=>`<span>${swatch(c)}${esc(c)} <span class="muted num">${fkg(v)}</span></span>`).join('')}</div>
    <div class="muted" style="font-size:12.5px">Custo estimado ${brl(p.valor)}</div></div>`).join('')||`<div class="card"><div class="empty"><b>Estoque vazio</b>As compras entram no estoque automaticamente. Para material que já está no barracão, use “Ajuste / estoque inicial”.</div></div>`}</div>
  <div class="card"><div class="card-h"><h2>Saldo detalhado</h2><div class="sp toolbar">
    <select class="f" data-act="estTipo" id="estTipo"><option value="">Todos os tipos</option>${tipos.map(t=>`<option ${UI.estTipo===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
    <select class="f" data-act="estCor" id="estCor"><option value="">Todas as cores</option>${cores.map(t=>`<option ${UI.estCor===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Material</th><th>Cor</th><th>Embalagem</th><th class="r">Peso da embalagem</th><th class="r">Qtd. embalagens</th><th class="r">Peso total</th><th class="r">Custo médio/kg</th><th class="r">Valor em estoque</th></tr></thead><tbody>
    ${rows.map(e=>`<tr><td>${esc(e.tipo)}</td><td>${swatch(e.cor)}${esc(e.cor)}</td><td>${EMB[e.embalagem]}</td><td class="r">${e.embalagem==='granel'?'—':fkg(e.pesoUn)}</td><td class="r">${e.embalagem==='granel'?'—':fnum(e.un,0)}</td><td class="r ${e.kg<0?'neg':''}"><b>${fkg(e.kg)}</b></td><td class="r">${e.custoKg?brl(e.custoKg):'—'}</td><td class="r">${brl(e.valor)}</td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">Nenhum item para o filtro.</div></td></tr>'}
    </tbody>${rows.length?`<tfoot><tr><td colspan="5">Total</td><td class="r">${fkg(totKg)}</td><td></td><td class="r">${brl(totVal)}</td></tr></tfoot>`:''}</table></div></div>
  <div class="card"><div class="card-h"><h2>Movimentação de estoque</h2><span class="sp muted" style="font-size:13px">últimos 40 lançamentos</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Origem</th><th>Material</th><th>Embalagem</th><th class="r">Peso</th><th></th></tr></thead><tbody>
    ${kx.slice(0,40).map(k=>`<tr><td class="num">${fd(k.data)}</td><td>${esc(k.o)} <span class="muted">${esc(k.p)}</span></td><td>${swatch(k.it.cor)}${esc(k.it.tipo)} ${esc(k.it.cor)}</td><td class="muted">${k.it.embalagem==='granel'?'Granel':fnum(k.it.qtd,0)+' × '+EMB[k.it.embalagem]+' '+fnum(k.it.pesoUn,0)+' kg'}</td><td class="r ${k.s>0?'pos':'neg'}">${k.s>0?'+ ':'− '}${fkg(k.it.kg)}</td><td class="acts">${k.aj?`<button class="btn sm danger" data-act="delAjuste" data-id="${k.aj}">Excluir</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Sem movimentação.</div></td></tr>'}
    </tbody></table></div></div>`};
}

/* ---------- Cadastros ---------- */

  rows.sort((a,b)=>a.nome.localeCompare(b.nome));

/* ===================== modais ===================== */
let modalClose=null;
function modal(title,body,{wide=false,submit='Salvar',onSubmit,onMount,extra=''}={}){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="ov"><form class="modal ${wide?'wide':''}" novalidate><div class="modal-h"><h3>${title}</h3><button type="button" class="x" data-x aria-label="Fechar">×</button></div><div class="modal-b">${body}<div class="err" id="mErr" hidden></div></div><div class="modal-f">${extra}<button type="button" class="btn" data-x>Cancelar</button>${submit?`<button class="btn pri" type="submit">${submit}</button>`:''}</div></form></div>`;
  const form=root.querySelector('form');
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',kd);modalClose=null};
  const kd=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',kd);modalClose=close;
  root.querySelectorAll('[data-x]').forEach(b=>b.onclick=close);
  root.querySelector('.ov').addEventListener('mousedown',e=>{if(e.target.classList.contains('ov'))close()});
  form.onsubmit=async e=>{e.preventDefault();const err=$('#mErr');err.hidden=true;
    const btn=form.querySelector('[type=submit]');if(btn)btn.disabled=true;
    try{const r=await onSubmit(form);if(r===false){if(btn)btn.disabled=false;return}close();}
    catch(ex){err.textContent=typeof ex==='string'?ex:('Não foi possível salvar: '+(ex?.message||ex));err.hidden=false;if(btn)btn.disabled=false}};
  if(onMount)onMount(form);
  const f=form.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select');if(f&&!('ontouchstart' in window))f.focus();
  return form;
}
function ask(title,msg,buttons){return new Promise(res=>{
  modal(title,`<p style="margin:0">${msg}</p>`,{submit:'',extra:buttons.map((b,i)=>`<button type="button" class="btn ${b.cls||''}" data-ans="${i}">${b.label}</button>`).join(''),onSubmit:()=>{}});
  $('#modalRoot').querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{const v=buttons[+b.dataset.ans].v;modalClose&&modalClose();res(v)});
  $('#modalRoot').querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>res(null)));
})}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

const opt=(list,sel,ph)=>(ph?`<option value="">${ph}</option>`:'')+list.map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('');
const contaOpts=(sel,tipoPref)=>S.contas.filter(c=>c.ativo!==false||c.id===sel).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nome)} · ${TIPOCONTA[c.tipo]}</option>`).join('');

  {submit:pagar?'Confirmar pagamento':'Confirmar recebimento',onSubmit:async f=>{const v=num(fv(f,'valor'));if(v<=0)throw'Informe o valor.';

    await put('titulos',{...t,pago:true,pagoEm:data,valorPago:r2(v),contaId:fv(f,'contaId'),movimentoId:mid});toast(pagar?'Pagamento registrado':'Recebimento registrado')}});

async function estornar(id){
  const t=byId('titulos',id);
  const ok=await ask('Estornar lançamento',`Desfazer o ${t.lado==='pagar'?'pagamento':'recebimento'} de <b>${esc(t.descricao)}</b> (${brl(t.valorPago||t.valor)})? O valor volta para a conta e o lançamento fica em aberto.`,[{label:'Estornar',cls:'pri',v:true}]);
  if(!ok)return;
  for(const m of S.movimentos.filter(m=>m.ref?.id===t.id))await del('movimentos',m.id);
  const {pago,pagoEm,valorPago,movimentoId,contaId,...rest}=t;await put('titulos',{...rest,pago:false});toast('Estornado');
}
async function delTitulo(id){
  const t=byId('titulos',id);const futuros=S.titulos.filter(o=>o.grupo===t.grupo&&o.id!==t.id&&!o.pago&&o.vencimento>=t.vencimento);
  if(t.ref){const src=byId(t.ref.col,t.ref.id);if(src){await ask('Lançamento vinculado',`Esta parcela foi gerada pela ${t.ref.col==='compras'?'compra':'venda'} #${src.numero}. Para alterar, edite ou exclua a ${t.ref.col==='compras'?'compra':'venda'}.`,[]);return}}
  const btns=[{label:'Excluir só este',cls:'danger',v:'one'}];if(futuros.length)btns.push({label:`Este e os próximos ${futuros.length} em aberto`,cls:'danger',v:'all'});
  const r=await ask('Excluir lançamento',`Excluir <b>${esc(t.descricao)}</b> com vencimento em ${fd(t.vencimento)}?${t.pago?' O pagamento/recebimento registrado no caixa também será removido.':''}`,btns);
  if(!r)return;
  const alvo=r==='all'?[t,...futuros]:[t];
  for(const x of alvo){for(const m of S.movimentos.filter(m=>m.ref?.id===x.id))await del('movimentos',m.id);await del('titulos',x.id)}
  toast(alvo.length>1?`${alvo.length} lançamentos excluídos`:'Lançamento excluído');
}

/* --- compra / venda --- */
function formOp(col,id){

    <div class="box" id="fpConta"><label class="fl">${isC?'Sai de qual conta':'Entra em qual conta'}<select name="contaId" id="oConta">${contaOpts(o.contaId||defaultConta(o.forma))}</select></label></div>
    <div class="box" id="fpCred"><div class="row"><label class="fl">Parcelas<input name="parcelas" id="oParcelas" inputmode="numeric" value="${o.parcelas||1}"></label><label class="fl">1º vencimento<input type="date" name="primeiroVenc" id="oVenc" value="${o.primeiroVenc||addDays(today(),30)}"></label></div><div class="hint" id="credPrev"></div></div>
    <div class="box" id="fpPerm"><label class="fl">O que foi dado/recebido em troca<input name="permutaDesc" id="oPerm" value="${esc(o.permutaDesc||'')}" placeholder="Ex.: 2 big bags de PP preto moído"></label><span class="hint">Troca/permuta não movimenta o caixa. Se o material dado em troca saiu do estoque, lance também a venda/ajuste correspondente.</span></div>

      <td><input data-k="kg" inputmode="decimal" value="${fnum(it.kg)}">${av!==null?`<div class="avail ${av<num(it.kg)?'low':''}">Em estoque: ${fkg(av)}</div>`:''}</td>
      <td><input data-k="precoKg" inputmode="decimal" value="${it.precoKg===''?'':fnum(it.precoKg,4)}"></td>
      <td class="r" style="padding-top:12px;font-weight:600" data-sub>${brl(num(it.kg)*num(it.precoKg))}</td>
      <td><button type="button" class="btn sm danger" data-rm="${i}" ${itens.length<2?'disabled':''} aria-label="Remover item">×</button></td></tr>`}).join('');totals()};
    const totals=()=>{const kgT=itens.reduce((a,i)=>a+num(i.kg),0),t=itens.reduce((a,i)=>a+num(i.kg)*num(i.precoKg),0);
      $('#totLine').innerHTML=`<div><span>Peso total</span>${fkg(kgT)}</div><div><span>Média</span>${kgT?brl(t/kgT)+'/kg':'—'}</div><div><span>Total</span>${brl(t)}</div>`;
      tb.querySelectorAll('tr').forEach(tr=>{const it=itens[+tr.dataset.i];tr.querySelector('[data-sub]').textContent=brl(num(it.kg)*num(it.precoKg))});credPrev()};
    const credPrev=()=>{const n=Math.max(1,parseInt(fv(f,'parcelas'))||1);const t=itens.reduce((a,i)=>a+num(i.kg)*num(i.precoKg),0);const v=fv(f,'primeiroVenc')||today();
      $('#credPrev').textContent=t?`${n}x de cerca de ${brl(t/n)} · ${isC?'vai para Contas a pagar':'vai para Contas a receber'} de ${fd(v)} até ${fd(addMonths(v,n-1))}`:''};
    tb.addEventListener('input',e=>{const tr=e.target.closest('tr');if(!tr)return;const it=itens[+tr.dataset.i];const k=e.target.dataset.k;
      if(k==='qtd'||k==='pesoUn'||k==='kg'||k==='precoKg'){it[k]=e.target.value;if(k==='qtd'||k==='pesoUn'){it.kg=r2(num(it.qtd)*num(it.pesoUn));tr.querySelector('[data-k=kg]').value=fnum(it.kg)}
        if(!isC&&(k!=='precoKg')){const av=tr.querySelector('.avail');if(av)av.classList.toggle('low',disponivel(it,id)<num(it.kg))}totals()}});
    tb.addEventListener('change',e=>{const tr=e.target.closest('tr');if(!tr)return;const it=itens[+tr.dataset.i];const k=e.target.dataset.k;
      if(k==='tipo'||k==='cor'||k==='embalagem'){it[k]=e.target.value;if(k==='embalagem'){if(it.embalagem==='granel'){it.qtd=0;it.pesoUn=0}else{it.pesoUn=it.embalagem==='saco'?c.pesoSaco:c.pesoBag;it.qtd=it.qtd||1;it.kg=r2(num(it.qtd)*num(it.pesoUn))}}drawRows()}});
    tb.addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){itens.splice(+b.dataset.rm,1);drawRows()}});
    $('#addIt').onclick=()=>{const l=itens[itens.length-1]||{};itens.push({tipo:l.tipo||c.tipos[0],cor:c.cores[0],embalagem:l.embalagem||'bigbag',qtd:1,pesoUn:l.pesoUn||c.pesoBag,kg:l.pesoUn||c.pesoBag,precoKg:l.precoKg||''});drawRows()};
    const fp=()=>{const v=f.elements.forma.value;$('#fpConta').hidden=!(v==='dinheiro'||v==='pix');$('#fpCred').hidden=v!=='credito';$('#fpPerm').hidden=v!=='permuta'};
    f.querySelectorAll('[name=forma]').forEach(r=>r.addEventListener('change',()=>{fp();const sel=$('#oConta');const d=defaultConta(f.elements.forma.value);if(sel&&d&&!id)sel.value=d}));
    $('#oParcelas').addEventListener('input',credPrev);$('#oVenc').addEventListener('change',credPrev);
    $('#oParc').addEventListener('change',e=>{$('#novoParc').hidden=e.target.value!=='__novo'});
    fp();drawRows();
  },onSubmit:async f=>{
    let parceiroId=fv(f,'parceiroId');
    if(!parceiroId)throw`Selecione o ${isC?'fornecedor':'cliente'}.`;
    const its=itens.map(i=>({tipo:i.tipo,cor:i.cor,embalagem:i.embalagem,qtd:i.embalagem==='granel'?0:num(i.qtd),pesoUn:i.embalagem==='granel'?0:num(i.pesoUn),kg:r2(num(i.kg)),precoKg:num(i.precoKg)}));

    const total=r2(its.reduce((a,i)=>a+i.kg*i.precoKg,0)),totalKg=r2(its.reduce((a,i)=>a+i.kg,0));

      await put('parceiros',{id:parceiroId,nome,pessoa:f.elements.np_pessoa.value,documento:fv(f,'np_documento'),fornecedor:isC,cliente:!isC})}
    else{const p=byId('parceiros',parceiroId);if(p&&!(isC?p.fornecedor:p.cliente))await put('parceiros',{...p,[isC?'fornecedor':'cliente']:true})}
    const numero=id?o.numero:(Math.max(0,...S[col].map(x=>x.numero||0))+1);
    const opId=id||nid();const data=fv(f,'data')||today();
    const rec={...o,id:opId,numero,data,parceiroId,itens:its,total,totalKg,forma,contaId:(forma==='dinheiro'||forma==='pix')?fv(f,'contaId'):'',parcelas:forma==='credito'?Math.max(1,Math.min(60,parseInt(fv(f,'parcelas'))||1)):0,primeiroVenc:forma==='credito'?(fv(f,'primeiroVenc')||today()):'',permutaDesc:forma==='permuta'?fv(f,'permutaDesc'):'',obs:fv(f,'obs'),criadoEm:o.criadoEm||Date.now()};
    if(id)await removeLinked(id);
    await put(col,rec);
    const pn=parcNome(parceiroId)!=='—'?parcNome(parceiroId):(fv(f,'np_nome')||'');
    const desc=`${isC?'Compra':'Venda'} #${numero} · ${pn}`;
    if(forma==='dinheiro'||forma==='pix'){await put('movimentos',{id:nid(),tipo:isC?'saida':'entrada',data,valor:total,contaId:rec.contaId,descricao:desc+` (${FORMA[forma]})`,categoria:isC?'Compra de material':'Venda de material',parceiroId,ref:{col,id:opId},criadoEm:Date.now()})}
    if(forma==='credito'){const list=genTitulos({lado:isC?'pagar':'receber',descricao:desc,parceiroId,categoria:isC?'Compra de material':'Venda de material',natureza:isC?'variavel':'',ref:{col,id:opId},criadoEm:Date.now()},'parcelada',rec.parcelas,total,rec.primeiroVenc);for(const x of list)await put('titulos',x)}
    toast(`${isC?'Compra':'Venda'} #${numero} salva`);
  }});
}

/* ===================== eventos ===================== */
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();if(modalClose)modalClose();go(g.dataset.go);return}
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  const a=b.dataset.act,id=b.dataset.id;
  try{switch(a){
    case 'mes':UI.mes=addMonths(UI.mes+'-01',+b.dataset.d).slice(0,7);render();break;
    case 'novaConta':formConta();break;case 'editConta':formConta(id);break;
    case 'mov':formMov(b.dataset.t);break;case 'transf':formMov('transferencia');break;
    case 'editMov':formMov(null,id);break;
    case 'delMov':{const m=byId('movimentos',id);
      if(m.ref){const src=m.ref.col==='titulos'?byId('titulos',m.ref.id):byId(m.ref.col,m.ref.id);
        if(m.ref.col==='titulos'&&src){await estornar(src.id);break}
        if(src){await ask('Lançamento vinculado',`Este lançamento veio da ${m.ref.col==='compras'?'compra':'venda'} #${src.numero}. Para removê-lo, edite ou exclua a ${m.ref.col==='compras'?'compra':'venda'}.`,[]);break}}
      if(await ask('Excluir movimentação',`Excluir <b>${esc(m.descricao)}</b> de ${brl(m.valor)}?`,[{label:'Excluir',cls:'danger',v:true}])){await del('movimentos',id);toast('Excluído')}break}
    case 'filtroConta':UI.filtroConta=UI.filtroConta===id?'':id;render();break;
    case 'filtroT':UI.filtroT=b.dataset.v;render();break;
    case 'cadFiltro':UI.cadFiltro=b.dataset.v;render();break;
    case 'novoTitulo':formTitulo(b.dataset.lado);break;case 'editTitulo':formTitulo(null,id);break;
    case 'baixar':formBaixa(id);break;case 'estornar':await estornar(id);break;case 'delTitulo':await delTitulo(id);break;
    case 'novaCompra':formOp('compras');break;case 'novaVenda':formOp('vendas');break;
    case 'editOp':formOp(b.dataset.col,id);break;case 'delOp':await delOp(b.dataset.col,id);break;
    case 'novoParc':formParc();break;case 'editParc':if(modalClose)modalClose();formParc(id);break;case 'verParc':verParc(id);break;
    case 'delParc':{const p=byId('parceiros',id);const usado=S.compras.some(x=>x.parceiroId===id)||S.vendas.some(x=>x.parceiroId===id)||S.titulos.some(x=>x.parceiroId===id);
      if(usado){await ask('Cadastro em uso',`<b>${esc(p.nome)}</b> tem compras, vendas ou contas vinculadas e não pode ser excluído.`,[]);break}
      if(await ask('Excluir cadastro',`Excluir <b>${esc(p.nome)}</b>?`,[{label:'Excluir',cls:'danger',v:true}])){await del('parceiros',id);toast('Cadastro excluído')}break}
    case 'ajuste':formAjuste();break;
    case 'dispensar':(UI.dispensados||(UI.dispensados=new Set())).add(id);render();break;
    case 'delAjuste':if(await ask('Excluir ajuste','Excluir este ajuste de estoque?',[{label:'Excluir',cls:'danger',v:true}])){await del('ajustes',id);toast('Ajuste excluído')}break;
    case 'cfgDel':{const k=b.dataset.k;const l=cfg()[k].slice();l.splice(+b.dataset.i,1);await saveCfg({[k]:l});break}
    case 'limparEx':{if(!await ask('Remover dados de exemplo','Todos os registros marcados como exemplo serão apagados. Os dados que você lançou continuam.',[{label:'Remover exemplos',cls:'danger',v:true}]))break;
      let n=0;for(const col of COLS)for(const x of S[col].filter(x=>x.exemplo)){await del(col,x.id);n++}toast(n+' registros removidos');break}
  }}catch(ex){console.error(ex);toast('Erro: '+(ex?.message||ex?.code||ex))}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.nav a')){e.target.click()}});
document.addEventListener('change',e=>{const a=e.target.dataset?.act;
  if(a==='fConta'){UI.filtroConta=e.target.value;render()}
  if(a==='estTipo'){UI.estTipo=e.target.value;render()}
  if(a==='estCor'){UI.estCor=e.target.value;render()}});
let bt=null;document.addEventListener('input',e=>{if(e.target.id==='busca'){UI.busca=e.target.value;clearTimeout(bt);bt=setTimeout(render,180)}});
document.addEventListener('submit',async e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  try{if(f.dataset.form==='cfgAdd'){const k=f.dataset.k;const v=f.elements.v.value.trim();if(!v)return;const l=cfg()[k];if(l.includes(v)){toast('Já existe');return}await saveCfg({[k]:[...l,v]});toast('Adicionado')}
  if(f.dataset.form==='cfgPesos'){await saveCfg({pesoSaco:num(f.elements.pesoSaco.value)||25,pesoBag:num(f.elements.pesoBag.value)||1000});toast('Pesos salvos')}}catch(ex){toast('Erro: '+(ex?.message||ex))}});

/* ===================== boot ===================== */
(function(){const h=(location.hash||'').slice(1);if(TITLES[h])UI.view=h})();
renderNav();
(function(){const d=new Date();const s=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});$('#today').textContent=s.charAt(0).toUpperCase()+s.slice(1)})();
if(!window.SUPA_CFG)(async function(){let u=null;try{if(window.claude&&typeof window.claude.use==='function')u=await window.claude.use('user')}catch(e){}
  if(!u){$('#urole').textContent='Modo local';return}
  try{const me=await u.me();const nome=(me&&me.name)||'';const first=nome.split(' ')[0];
    if(first){$('#hello').textContent='Olá, '+first+'!';$('#uname').textContent=nome;$('#av').textContent=first.charAt(0).toUpperCase()}
    const adm=await u.canEdit();$('#urole').textContent=adm?'Administrador':'Colaborador'}catch(e){$('#urole').textContent=''}})();
if(window.SUPA_CFG)initSupa();else initStore();
</script>

</body></html>
