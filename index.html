<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<style>*{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
</head><body>
<title>ERP 3STRUZA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar grafite fixa com a marca + área de trabalho clara com cabeçalho, filtros de mês e tabelas operacionais */
:root{
  --brand:#0B419E; --graphite:#30363C;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F8FB; --fg:#1A1F26; --muted:#6B7380; --line:#E6EAF0;
  --accent:#0B419E; --accent-hover:#08357F; --on-accent:#FFFFFF; --accent-soft:#EAF1FD; --notice:#F2F7FF; --notice-line:#C9DBF7;
  --side:#FFFFFF; --side-fg:#3A414B; --side-active:#EAF1FD; --side-icon:#7A828D;
  --pos:#1E8449; --pos-soft:#E5F4EB; --neg:#C0392B; --neg-soft:#FBEAE8; --warn:#A86A0C; --warn-soft:#FBF1DF;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --logo-l:block; --logo-d:none;
  --g-blue:linear-gradient(135deg,#3B8BEB 0%,#0B419E 100%);
  --g-graph:linear-gradient(135deg,#8B5CF6 0%,#4F46E5 100%);
  --g-green:linear-gradient(135deg,#3DAA7A 0%,#1F6F57 100%);
}
:root{color-scheme:light}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.r,.kpi b{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100%}

/* sidebar */
.side{background:var(--side);color:var(--side-fg);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{padding:20px 20px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.side .logo .mark{width:46px;height:46px;border-radius:50%;background:var(--g-blue);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 8px rgba(11,65,158,.25)}
.side .logo .mark img{width:28px;height:auto}
.side .logo .nm{display:flex;flex-direction:column;gap:5px;min-width:0}
.side .logo .nm img{width:128px;max-width:100%}
.side .logo .lg-l{display:var(--logo-l)} .side .logo .lg-d{display:var(--logo-d)}
.side .logo small{font-size:13px;color:var(--muted);white-space:nowrap}
.nav-sep{height:1px;background:var(--line);margin:8px 4px}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.nav-group{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 12px 6px}
.nav-group:first-child{padding-top:4px}
.nav a{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:11px;color:var(--side-fg);text-decoration:none;font-weight:500;font-size:15.5px;cursor:pointer}
.nav a svg{color:var(--side-icon)}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--side-active);color:var(--accent)}
.nav a.on svg{color:var(--accent)}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;background:#E5484D;color:#fff;font-size:11.5px;font-weight:700;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;border-radius:11px}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:10px;background:var(--g-blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.side .foot b{display:block;font-size:14.5px;color:var(--fg)}
.side .foot small{font-size:12.5px;color:var(--muted)}
.side .foot .chev{margin-left:auto;width:18px;height:18px;color:var(--muted);flex:none}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:14px}
.datepill{margin-left:auto;display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:500;font-size:14.5px;background:var(--surface);box-shadow:var(--shadow)}
.syncpill{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:500;color:var(--muted);background:var(--surface)}
.syncpill i{width:8px;height:8px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px var(--pos-soft)}
.syncpill.saving i{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.syncpill.off{color:var(--neg);border-color:var(--neg)} .syncpill.off i{background:var(--neg);box-shadow:0 0 0 3px var(--neg-soft)}
.syncpill:not([hidden])+.datepill{margin-left:0}
.hrow-diff{margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:4px 14px}
.hrow-diff .k{color:var(--muted)} .hrow-diff del{color:var(--neg);text-decoration:line-through} .hrow-diff ins{color:var(--pos);text-decoration:none}
.datepill svg{width:18px;height:18px;color:var(--muted)}
.sec-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.sec-h h2{font-size:28px;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sec-h p{margin:4px 0 0;color:var(--muted);font-size:15px}
.sec-h .actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.sec-h .actions .btn:not(.pri){background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.sec-h .actions .btn:not(.pri):hover{border-color:var(--accent)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:7px;padding:6px 8px;cursor:pointer}
.content{padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-hover);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.soft:hover{border-color:var(--accent)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.danger{color:var(--neg)}
.btn.danger:hover{border-color:var(--neg)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600}

.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative;min-width:0}
.kpi span{font-size:15px;color:var(--muted);font-weight:500}
.kpi b{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.kpi small{color:var(--muted);font-size:13.5px}
.kpi .ic{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.kpi .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi .ic.w{background:var(--warn-soft);color:var(--warn)} .kpi .ic.n{background:var(--neg-soft);color:var(--neg)} .kpi .ic.p{background:var(--pos-soft);color:var(--pos)}
.kpi.hl{background:var(--g-blue);border-color:transparent;color:#fff;overflow:hidden}
.kpi.hl span,.kpi.hl small{color:#fff;opacity:.88}
.heroes{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.hero{border-radius:18px;padding:24px 26px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:230px;min-width:0}
.hero::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.09);top:-70px;right:-50px}
.hero.blue{background:var(--g-blue)} .hero.graph{background:var(--g-graph)} .hero.green{background:var(--g-green)}
.hero h3{margin:0;font-size:16px;font-weight:600;position:relative}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1;position:relative;font-variant-numeric:tabular-nums}
.hero .ic{position:absolute;top:22px;right:22px;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.hero .ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero .chip{align-self:flex-start;background:rgba(255,255,255,.18);border-radius:20px;padding:3px 12px;font-size:13px;font-weight:500}
.hero .meta{font-size:14.5px;opacity:.9}
.hero h3,.hero .big,.hero .meta,.hero .chip,.hero .foot{position:relative}
.hero .foot{margin-top:6px;border-top:1px solid rgba(255,255,255,.25);padding-top:12px;font-size:14px;opacity:.92}
.hero svg.spark{width:100%;height:auto;display:block;margin-top:auto}
.hero svg.spark text{fill:rgba(255,255,255,.8);font-size:10px;font-family:var(--f-body)}
.notice{background:var(--notice);border:1px solid var(--notice-line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.notice h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.notice h3 svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.notice .nrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.notice .nrow .t{flex:1;min-width:200px;font-size:15px}
.btn.dark{background:#30363C;border-color:#30363C;color:#fff}
.btn.dark:hover{background:#1F2328;color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:500}
.btn.ghost:hover{color:var(--fg);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px;font-weight:600;margin:0}
.card-h .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-b{padding:16px 18px}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right;white-space:nowrap}
td.acts{white-space:nowrap;text-align:right}
td .muted,.muted{color:var(--muted)}
tfoot td{font-weight:700;background:var(--surface-2)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.p-ok{background:var(--pos-soft);color:var(--pos)}
.p-late{background:var(--neg-soft);color:var(--neg)}
.p-open{background:var(--warn-soft);color:var(--warn)}
.p-info{background:var(--accent-soft);color:var(--accent)}
.p-grey{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.month{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--surface);overflow:hidden}
.month button{background:none;border:0;padding:7px 11px;cursor:pointer;font-size:16px;line-height:1}
.month button:hover{color:var(--accent)}
.month span{min-width:132px;text-align:center;font-weight:600;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
input.search,select.f{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--surface);min-width:0}

/* contas cards */
.accts{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.acct{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.acct .t{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.acct .n{font-weight:600}
.acct b{font-family:var(--f-display);font-size:24px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-banco{background:var(--accent)} .d-gaveta{background:var(--pos)} .d-credito{background:var(--warn)}

/* estoque */
.stock{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sc h3{margin:0;font-family:var(--f-display);font-size:17px}
.sc b{font-family:var(--f-display);font-size:26px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:6px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(12,16,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{max-width:980px}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-family:var(--f-display);font-size:21px}
.modal-h .x{margin-left:auto;background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.fl input,label.fl select,label.fl textarea,.items input,.items select{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface);color:var(--fg);font-weight:400;font-size:14.5px;width:100%;min-width:0}
label.fl textarea{min-height:64px;resize:vertical}
.chk{display:flex;gap:16px;flex-wrap:wrap}
.chk label{display:flex;align-items:center;gap:6px;font-weight:500;cursor:pointer}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opts input{accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.box{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.items{width:100%;border-collapse:collapse}
.items th{background:none;padding:4px 6px;border:0}
.items td{padding:4px 6px;border:0;vertical-align:top}
.items tr:hover td{background:none}
.items .avail{font-size:11.5px;color:var(--muted);padding-top:3px}
.items .avail.low{color:var(--neg)}
.total-line{display:flex;justify-content:flex-end;gap:24px;font-weight:700;font-size:16px;flex-wrap:wrap}
.total-line span{font-weight:500;color:var(--muted);font-size:13px;margin-right:6px}
.err{color:var(--neg);font-size:13.5px;font-weight:600}

.login{position:fixed;inset:0;z-index:70;background:linear-gradient(160deg,#F4F8FF 0%,#FFFFFF 60%);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(11,65,158,.12);padding:32px;display:flex;flex-direction:column;gap:14px}
.login-mark{width:56px;height:56px;border-radius:50%;background:var(--g-blue);display:flex;align-items:center;justify-content:center}
.login-mark img{width:34px}
.login-logo{width:170px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#30363C;color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--line);border-radius:9px;padding:10px 14px;font-size:14px;font-weight:500}

.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .d{font-size:12.5px;color:var(--muted);width:64px;flex:none}
.li .m{min-width:0;flex:1}
.li .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font-weight:700;white-space:nowrap}

.scrim{display:none}
@media (max-width:980px){
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1100px){
  .app{grid-template-columns:224px minmax(0,1fr)}
  .side .logo{padding:16px 14px}
  .side .logo .nm img{width:108px}
  .top,.content{padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
  .hero .big{font-size:30px}
}
@media (max-width:600px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .2s;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
  .burger{display:inline-flex}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top h1{font-size:19px}
  .datepill{display:none}
  .sec-h h2{font-size:23px}
  .sec-h .actions{margin-left:0;width:100%}
}
@media (max-width:700px){
  table.items thead{display:none}
  table.items,table.items tbody{display:block;min-width:0}
  table.items tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  table.items td{display:block;padding:0!important;border:0!important}
  table.items td::before{content:attr(data-l);display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
  table.items td:nth-child(1){grid-column:1/-1}
  table.items td:nth-child(9){align-self:end;text-align:right}
  table.items td select,table.items td input{width:100%}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

const p2=n=>String(n).padStart(2,'0');

const num=v=>{if(typeof v==='number')return v;v=String(v??'').trim().replace(/[R$\s]/g,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');const n=parseFloat(v);return isFinite(n)?n:0};

const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const fd=s=>s?s.split('-').reverse().join('/'):'—';

function addDays(s,n){const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())}

/* --- sincronização --- */
const QKEY='3struza-fila';let QUEUE=[];try{QUEUE=JSON.parse(localStorage.getItem(QKEY)||'[]')}catch(e){QUEUE=[]}
const saveQ=()=>{try{localStorage.setItem(QKEY,JSON.stringify(QUEUE))}catch(e){}};
let flushing=false,retryT=null,lastSync=null,rtOk=false;
function enqueue(op){QUEUE.push(op);saveQ();setSync('saving');flush()}
const isNetErr=e=>!navigator.onLine||/fetch|network|Failed to|Load failed|timeout/i.test(String(e?.message||e));
async function flush(){
  if(flushing||!SB)return;flushing=true;
  while(QUEUE.length){
    const op=QUEUE[0];let error=null;
    try{const r=op.t==='put'?await SB.from('docs').upsert({col:op.col,id:op.id,data:op.data,updated_at:new Date().toISOString()}):await SB.from('docs').delete().eq('col',op.col).eq('id',op.id);error=r.error}catch(e){error=e}
    if(error){
      // nunca descarta a alteração: fica na fila até o banco aceitar
      flushing=false;clearTimeout(retryT);
      if(isNetErr(error)){setSync('off');retryT=setTimeout(flush,8000);return}
      console.error(error);
      if(isAuthErr(error)){setSync('auth');reauth();return}
      saveErr=error.message||String(error);setSync('err');retryT=setTimeout(flush,30000);return}
    QUEUE.shift();saveQ();
  }
  flushing=false;saveErr='';lastSync=new Date();setSync('ok');
  if(REAUTH){REAUTH=false;$('#login').hidden=true}
}
let saveErr='';
const isAuthErr=e=>/jwt|token|auth|401|403|42501|PGRST30|permission denied|row-level security|not authorized/i.test(String(e?.message||'')+' '+String(e?.code||'')+' '+String(e?.status||''));
// sessão vencida: pede login de novo sem perder a fila
async function reauth(){
  try{const{data}=await SB.auth.refreshSession();if(data?.session){flush();return}}catch(e){}
  REAUTH=true;const l=$('#login');l.hidden=false;
  $('#lgErr').textContent=`Sua sessão expirou. Entre de novo para salvar ${QUEUE.length} alteração(ões) pendente(s).`;$('#lgErr').hidden=false;
  setTimeout(()=>$('#lgEmail').focus(),50);
}
let REAUTH=false;
function applyQueueLocal(){for(const op of QUEUE){if(!S[op.col])continue;if(op.t==='put')upsertLocal(op.col,{id:op.id,...op.data});else S[op.col]=S[op.col].filter(x=>x.id!==op.id)}}
async function loadAll(){
  const all=[];
  for(let from=0;;from+=1000){let r;try{r=await SB.from('docs').select('col,id,data').range(from,from+999)}catch(e){r={error:e}}
    if(r.error){if(MODE!=='supa')$('#view').innerHTML='<div class="empty"><b>Erro ao carregar dados</b>'+esc(r.error.message||r.error)+'</div>';setSync('off');return false}
    all.push(...r.data);if(r.data.length<1000)break}
  COLS.forEach(c=>S[c]=[]);all.forEach(r=>{if(S[r.col])S[r.col].push({id:r.id,...r.data})});
  applyQueueLocal();lastSync=new Date();setSync(QUEUE.length?'saving':'ok');return true;
}
let resyncing=false;async function resync(){if(resyncing||MODE!=='supa')return;resyncing=true;if(await loadAll())schedule();if(!rtOk)subscribeRT();resyncing=false;if(UI.view==='historico')loadHist(true)}
let RT=null;
function subscribeRT(){
  if(RT){try{SB.removeChannel(RT)}catch(e){}}
  RT=SB.channel('erp-rt')
   .on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
      if(p.eventType==='DELETE'){const r=p.old;if(r&&S[r.col])S[r.col]=S[r.col].filter(x=>x.id!==r.id)}
      else{const r=p.new;if(r&&S[r.col])upsertLocal(r.col,{id:r.id,...r.data})}
      applyQueueLocal();lastSync=new Date();schedule()})
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'historico'},p=>{if(p.new&&HIST.loaded){HIST.rows.unshift(p.new);if(UI.view==='historico')schedule()}})
   .subscribe(st=>{rtOk=st==='SUBSCRIBED';if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){setTimeout(()=>{if(!rtOk)subscribeRT()},10000)}setSync()});
}
let syncState='ok';
function setSync(st){if(st)syncState=st;const el=$('#sync');if(!el)return;
  const q=QUEUE.length;let cls,txt;
  if(syncState==='off'){cls='off';txt=q?`Sem conexão · ${q} alteração(ões) aguardando`:'Sem conexão · tentando de novo'}
  else if(syncState==='auth'&&q){cls='off';txt=`Sessão expirada · ${q} alteração(ões) aguardando login`}
  else if(syncState==='err'&&q){cls='off';txt=`Erro ao salvar · ${q} pendente(s) · clique para tentar de novo`}
  else if(syncState==='saving'||q){cls='saving';txt='Salvando…'}
  else{cls='ok';txt='Sincronizado'+(lastSync?' · '+lastSync.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'')}
  el.className='syncpill '+cls;el.querySelector('span').textContent=txt;
  el.title=syncState==='err'&&q?'O banco recusou: '+saveErr+'. A alteração continua guardada neste navegador.':rtOk?'Atualização em tempo real ativa':'Tempo real reconectando; os dados são recarregados a cada minuto';
  el.style.cursor=q?'pointer':'';el.onclick=q?()=>{if(syncState==='auth')reauth();else{clearTimeout(retryT);flush()}}:null;
}

function saldoConta(id){
  const c=byId('contas',id);let s=num(c?.saldoInicial);
  for(const m of S.movimentos){
    if(m.tipo==='entrada'&&m.contaId===id)s+=num(m.valor);
    else if(m.tipo==='saida'&&m.contaId===id)s-=num(m.valor);
    else if(m.tipo==='transferencia'){if(m.contaId===id)s-=num(m.valor);if(m.contaDestinoId===id)s+=num(m.valor)}
  }return r2(s)
}
const saldoTotal=()=>S.contas.filter(c=>c.ativo!==false).reduce((a,c)=>a+saldoConta(c.id),0);
const statusT=t=>t.pago?'pago':(t.vencimento<today()?'atrasado':'aberto');
const STATUS_PILL={pago:['p-ok','Pago'],atrasado:['p-late','Atrasado'],aberto:['p-open','Em aberto']};
function pillT(t){const s=statusT(t);const[k,l]=STATUS_PILL[s];return `<span class="pill ${k}">${t.lado==='receber'&&s==='pago'?'Recebido':l}</span>`}
const EMB={saco:'Saco',bigbag:'Big Bag',granel:'Granel'};
const FORMA={dinheiro:'Dinheiro',pix:'PIX',permuta:'Troca / Permuta',credito:'Crédito (a prazo)'};
const TIPOCONTA={banco:'Banco · C/C',gaveta:'Físico · Gaveta',credito:'Crédito com terceiro'};
const stockKey=it=>[it.tipo,it.cor,it.embalagem,it.embalagem==='granel'?0:num(it.pesoUn)].join('|');

function estoque(){
  const m=new Map();
  const ensure=it=>{const k=stockKey(it);if(!m.has(k))m.set(k,{key:k,tipo:it.tipo,cor:it.cor,embalagem:it.embalagem,pesoUn:it.embalagem==='granel'?0:num(it.pesoUn),kg:0,un:0});return m.get(k)};
  const custo=new Map();
  const addCusto=(it,kg,valor)=>{const k=it.tipo+'|'+it.cor;const c=custo.get(k)||{kg:0,v:0};c.kg+=kg;c.v+=valor;custo.set(k,c)};
  S.compras.forEach(c=>(c.itens||[]).forEach(it=>{const e=ensure(it);e.kg+=num(it.kg);e.un+=num(it.qtd);addCusto(it,num(it.kg),num(it.kg)*num(it.precoKg))}));
  S.ajustes.forEach(a=>{const e=ensure(a);const s=a.sentido==='saida'?-1:1;e.kg+=s*num(a.kg);e.un+=s*num(a.qtd);if(s>0&&num(a.custoKg))addCusto(a,num(a.kg),num(a.kg)*num(a.custoKg))});
  S.vendas.forEach(v=>(v.itens||[]).forEach(it=>{const e=ensure(it);e.kg-=num(it.kg);e.un-=num(it.qtd)}));
  const rows=[...m.values()].map(e=>{const c=custo.get(e.tipo+'|'+e.cor);e.custoKg=c&&c.kg?c.v/c.kg:0;e.valor=e.kg*e.custoKg;return e});
  rows.sort((a,b)=>a.tipo.localeCompare(b.tipo)||a.cor.localeCompare(b.cor)||a.embalagem.localeCompare(b.embalagem)||a.pesoUn-b.pesoUn);
  return rows;
}
// custo médio por kg de cada material + cor (compras e ajustes de entrada com custo)
function custosMedios(){const m=new Map();const add=(it,kg,v)=>{const k=it.tipo+'|'+it.cor;const c=m.get(k)||{kg:0,v:0};c.kg+=kg;c.v+=v;m.set(k,c)};
  S.compras.forEach(c=>(c.itens||[]).forEach(it=>add(it,num(it.kg),num(it.kg)*num(it.precoKg))));
  S.ajustes.forEach(a=>{if(a.sentido!=='saida'&&num(a.custoKg))add(a,num(a.kg),num(a.kg)*num(a.custoKg))});
  const out=new Map();m.forEach((c,k)=>out.set(k,c.kg?c.v/c.kg:0));return out}
// custo estimado e margem de uma venda (custo médio do material)
function margemVenda(v,cm=custosMedios()){let custo=0,semCusto=false;(v.itens||[]).forEach(it=>{const c=cm.get(it.tipo+'|'+it.cor);if(!c)semCusto=true;custo+=num(it.kg)*(c||0)});
  return{custo:r2(custo),margem:r2(num(v.total)-custo),semCusto}}
// estoque disponível por material + cor (todas as embalagens somadas)
function dispMat(tipo,cor,ignoreVendaId){let kg=0;const ok=x=>x.tipo===tipo&&x.cor===cor;
  S.compras.forEach(c=>(c.itens||[]).forEach(x=>{if(ok(x))kg+=num(x.kg)}));
  S.ajustes.forEach(a=>{if(ok(a))kg+=(a.sentido==='saida'?-1:1)*num(a.kg)});
  S.vendas.forEach(v=>{if(v.id===ignoreVendaId)return;(v.itens||[]).forEach(x=>{if(ok(x))kg-=num(x.kg)})});
  return r2(kg)}
function faltaEstoque(its,ignoreVendaId){const pede=new Map();its.forEach(i=>{const k=i.tipo+'|'+i.cor;pede.set(k,(pede.get(k)||0)+num(i.kg))});
  return[...pede].map(([k,kg])=>{const[tipo,cor]=k.split('|');return{tipo,cor,pede:r2(kg),tem:dispMat(tipo,cor,ignoreVendaId)}}).filter(x=>x.pede>x.tem+0.005)}
// próximo número de compra/venda: consulta o banco para não repetir quando duas pessoas lançam juntas
async function proximoNumero(col){let mx=Math.max(0,...S[col].map(x=>num(x.numero)));
  if(MODE==='supa'&&navigator.onLine){try{const r=await SB.from('docs').select('n:data->numero').eq('col',col).order('data->numero',{ascending:false,nullsFirst:false}).limit(1);
    if(!r.error&&r.data&&r.data[0])mx=Math.max(mx,num(r.data[0].n))}catch(e){}}
  for(const op of QUEUE)if(op.col===col&&op.t==='put')mx=Math.max(mx,num(op.data?.numero));
  return mx+1}
function linked(refId){
  const tit=S.titulos.filter(t=>t.ref?.id===refId);
  const tids=new Set(tit.map(t=>t.id));
  const mov=S.movimentos.filter(m=>m.ref?.id===refId||tids.has(m.ref?.id));
  return{tit,mov};
}
async function removeLinked(refId){const{tit,mov}=linked(refId);for(const m of mov)await del('movimentos',m.id);for(const t of tit)await del('titulos',t.id)}
// contas recorrentes que renovam sozinhas: mantém 12 meses lançados à frente (id fixo evita duplicar entre usuários)
let renovando=false;
async function renovar(){if(renovando)return;renovando=true;
  try{const grupos=new Map();S.titulos.forEach(t=>{if(t.renova){const g=grupos.get(t.grupo)||[];g.push(t);grupos.set(t.grupo,g)}});
    const lim=addMonths(today(),11);
    for(const[g,ts]of grupos){const prim=ts.reduce((a,t)=>t.parcela<a.parcela?t:a);let ult=ts.reduce((a,t)=>t.parcela>a.parcela?t:a);
      while(ult.vencimento<lim){const k=ult.parcela+1;const{pago,pagoEm,valorPago,movimentoId,contaId,restoId,valorOriginal,restoDe,...b}=ult;
        const nv={...b,id:g+'-'+k,parcela:k,vencimento:addMonths(prim.vencimento,k-prim.parcela),valor:num(ult.valorOriginal)||num(ult.valor),pago:false,criadoEm:Date.now()};
        if(!byId('titulos',nv.id))await put('titulos',nv);ult=nv}}}
  finally{renovando=false}}
function genTitulos(base,modo,n,valor,venc){
  const grupo=nid();const out=[];
  if(modo==='unica'){out.push({...base,id:nid(),modo,grupo,parcela:1,totalParcelas:1,vencimento:venc,valor:r2(valor),pago:false})}
  else if(modo==='recorrente'){for(let i=0;i<n;i++)out.push({...base,id:nid(),modo,grupo,parcela:i+1,totalParcelas:n,vencimento:addMonths(venc,i),valor:r2(valor),pago:false})}
  else{const parc=Math.floor(valor/n*100)/100;let acc=0;for(let i=0;i<n;i++){const v=i===n-1?r2(valor-acc):parc;acc=r2(acc+parc);out.push({...base,id:nid(),modo,grupo,parcela:i+1,totalParcelas:n,vencimento:addMonths(venc,i),valor:v,pago:false})}}
  return out;
}

function vCaixa(){
  const contas=S.contas.filter(c=>c.ativo!==false);
  const fc=UI.filtroConta;const{ini,fim,label}=periodo();
  // efeito de cada movimentação no saldo (de uma conta, ou do caixa inteiro)
  const efeito=m=>{
    if(fc){if(m.tipo==='transferencia')return(m.contaDestinoId===fc?num(m.valor):0)-(m.contaId===fc?num(m.valor):0);
      if(m.contaId!==fc)return 0;return m.tipo==='entrada'?num(m.valor):-num(m.valor)}
    return m.tipo==='entrada'?num(m.valor):m.tipo==='saida'?-num(m.valor):0;
  };
  const doCaixa=m=>fc?(m.contaId===fc||m.contaDestinoId===fc):true;
  const todos=S.movimentos.filter(doCaixa).slice().sort((a,b)=>a.data.localeCompare(b.data)||(a.criadoEm||0)-(b.criadoEm||0));
  const saldoBase=fc?num(byId('contas',fc)?.saldoInicial):contas.reduce((a,c)=>a+num(c.saldoInicial),0);
  // saldo acumulado em ordem cronológica
  let acc=saldoBase,anterior=saldoBase;const sal=new Map();
  todos.forEach(m=>{if(m.data<ini){anterior+=efeito(m)}acc+=efeito(m);sal.set(m.id,acc)});
  let movs=todos.filter(m=>m.data>=ini&&m.data<=fim);

  const ent=movs.reduce((a,m)=>a+Math.max(0,efeito(m)),0),sai=movs.reduce((a,m)=>a+Math.max(0,-efeito(m)),0);
  movs=movs.slice().reverse();

  const lim=UI.caixaLim||200,ocultos=Math.max(0,movs.length-lim);const movsTela=movs.slice(0,lim);

  const origem=m=>{if(!m.ref)return'';const src=m.ref.col==='titulos'?byId('titulos',m.ref.id):byId(m.ref.col,m.ref.id);

    if(m.ref.col==='titulos')return `<span class="pill p-grey">${src?.lado==='receber'?'Conta a receber':'Conta a pagar'}</span>`;return''};
  const tituloExtrato=fc?'Extrato de '+esc(contaNome(fc)):'Extrato geral · todos os caixas';
  return{sub:'Entradas, saídas e saldo por local',actions:`<button class="btn" data-act="transf">⇄ Transferência</button><button class="btn" data-act="mov" data-t="saida">− Saída</button><button class="btn pri" data-act="mov" data-t="entrada">+ Entrada</button>`,html:`

function baixarCSV(){
  const contas=S.contas.filter(c=>c.ativo!==false);const fc=UI.filtroConta;const{ini,fim}=periodo();
  const efeito=m=>{if(fc){if(m.tipo==='transferencia')return(m.contaDestinoId===fc?num(m.valor):0)-(m.contaId===fc?num(m.valor):0);if(m.contaId!==fc)return 0;return m.tipo==='entrada'?num(m.valor):-num(m.valor)}
    return m.tipo==='entrada'?num(m.valor):m.tipo==='saida'?-num(m.valor):0};
  const todos=S.movimentos.filter(m=>fc?(m.contaId===fc||m.contaDestinoId===fc):true).slice().sort((a,b)=>a.data.localeCompare(b.data)||(a.criadoEm||0)-(b.criadoEm||0));
  let acc=fc?num(byId('contas',fc)?.saldoInicial):contas.reduce((a,c)=>a+num(c.saldoInicial),0);
  const linhas=[['Data','Descrição','Categoria','Cliente/fornecedor','Conta','Entrada','Saída','Saldo após']];
  todos.forEach(m=>{acc+=efeito(m);if(m.data<ini||m.data>fim)return;const e=efeito(m);
    linhas.push([fd(m.data),m.descricao,m.tipo==='transferencia'?'Transferência':(m.categoria||''),m.parceiroId?parcNome(m.parceiroId):'',
      m.tipo==='transferencia'?contaNome(m.contaId)+' > '+contaNome(m.contaDestinoId):contaNome(m.contaId),
      e>0?fnum(e):'',e<0?fnum(-e):'',fnum(acc)])});
  baixarCSVLinhas(linhas,'extrato-3struza-'+(fc?slug(contaNome(fc))+'-':'')+today()+'.csv');
}
const slug=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\W+/g,'-').replace(/^-|-$/g,'').toLowerCase();
function baixarArquivo(conteudo,nome,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));a.download=nome;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},0)}
function baixarCSVLinhas(linhas,nome){baixarArquivo('\ufeff'+linhas.map(l=>l.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),nome,'text/csv;charset=utf-8')}

const HIST={rows:[],loaded:false,loading:false,more:false,err:''};
UI.histOpen=new Set();UI.per='mes';UI.histPer='7';UI.histUser='';UI.histCol='';
const COLNOME={contas:'Conta de saldo',parceiros:'Cadastro',movimentos:'Caixa',compras:'Compra',vendas:'Venda',titulos:'Conta a pagar/receber',ajustes:'Ajuste de estoque',config:'Configurações'};
const histBtn=(col,id)=>MODE==='supa'?`<button class="btn sm" data-act="hist" data-col="${col}" data-id="${id}" title="Histórico deste registro" aria-label="Histórico"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>`:'';
async function loadHist(reset){
  if(MODE!=='supa'||HIST.loading)return;HIST.loading=true;if(reset){HIST.rows=[];HIST.more=false}
  let q=SB.from('historico').select('*').order('quando',{ascending:false}).range(HIST.rows.length,HIST.rows.length+99);
  if(UI.histPer!=='tudo')q=q.gte('quando',new Date(Date.now()-(+UI.histPer)*864e5).toISOString());
  if(UI.histUser)q=q.eq('usuario_email',UI.histUser);
  if(UI.histCol)q=q.eq('col',UI.histCol);
  const{data,error}=await q;HIST.loading=false;HIST.loaded=true;
  if(error){HIST.err=/historico/.test(error.message||'')?'missing':error.message;render();return}
  HIST.err='';HIST.rows.push(...data);HIST.more=data.length===100;render();
}
const LBL={nome:'Nome',tipo:'Tipo',detalhe:'Detalhe',saldoInicial:'Saldo inicial',ativo:'Ativa',valor:'Valor',data:'Data',descricao:'Descrição',categoria:'Categoria',contaId:'Conta',contaDestinoId:'Conta destino',parceiroId:'Cliente/fornecedor',vencimento:'Vencimento',pago:'Pago',pagoEm:'Pago em',valorPago:'Valor pago',itens:'Itens',total:'Total',totalKg:'Peso total',forma:'Forma de pagamento',pagamentos:'Contas do pagamento',parcelas:'Parcelas',primeiroVenc:'1º vencimento',numero:'Número',documento:'CPF/CNPJ',telefone:'Telefone',email:'E-mail',cidade:'Cidade',uf:'UF',endereco:'Endereço',fornecedor:'Fornecedor',cliente:'Cliente',obs:'Observações',natureza:'Natureza',modo:'Lançamento',parcela:'Parcela',pessoa:'Pessoa',sentido:'Sentido',kg:'Peso',qtd:'Quantidade',pesoUn:'Peso embalagem',embalagem:'Embalagem',cor:'Cor',custoKg:'Custo/kg',motivo:'Motivo',permutaDesc:'Troca/permuta',tipos:'Tipos de material',cores:'Cores',catPagar:'Categorias a pagar',catReceber:'Categorias a receber',pesoSaco:'Peso do saco',pesoBag:'Peso do big bag'};
const SKIP=new Set(['criadoEm','grupo','ref','movimentoId','exemplo','totalParcelas']);
const MONEY=new Set(['saldoInicial','valor','valorPago','total','custoKg','precoKg']);
function fmtVal(k,v){
  if(v===undefined||v===null||v==='')return '—';
  if(MONEY.has(k))return brl(v);
  if(['data','vencimento','pagoEm','primeiroVenc'].includes(k))return fd(v);
  if(['kg','totalKg','pesoSaco','pesoBag','pesoUn'].includes(k))return fkg(v);
  if(typeof v==='boolean')return v?'Sim':'Não';
  if(k==='contaId'||k==='contaDestinoId')return contaNome(v);
  if(k==='pagamentos'&&Array.isArray(v))return v.map(p=>contaNome(p.contaId)+' '+brl(p.valor)).join('; ');
  if(k==='parceiroId')return parcNome(v);
  if(k==='forma')return FORMA[v]||v;
  if(k==='tipo'&&TIPOCONTA[v])return TIPOCONTA[v];
  if(k==='tipo'&&({entrada:1,saida:1,transferencia:1})[v])return {entrada:'Entrada',saida:'Saída',transferencia:'Transferência'}[v];
  if(k==='sentido')return v==='saida'?'Saída':'Entrada';
  if(k==='natureza')return v==='fixa'?'Fixa':'Variável';
  if(k==='modo')return {unica:'Uma vez',recorrente:'Recorrente',parcelada:'Parcelado'}[v]||v;
  if(k==='embalagem')return EMB[v]||v;
  if(k==='itens'&&Array.isArray(v))return v.map(i=>`${i.tipo} ${i.cor} ${fkg(i.kg)} a ${brl(i.precoKg)}/kg`).join('; ');
  if(Array.isArray(v))return v.join(', ');
  if(typeof v==='object')return JSON.stringify(v);
  return String(v);
}
function descReg(col,d){
  if(!d)return '';
  switch(col){
    case 'contas':return `Conta “${d.nome}”`;
    case 'parceiros':return d.nome||'';
    case 'movimentos':return `${d.tipo==='entrada'?'Entrada':d.tipo==='saida'?'Saída':'Transferência'} de ${brl(d.valor)} · ${d.descricao||''}`;
    case 'compras':return `Compra #${d.numero} · ${parcNome(d.parceiroId)} · ${brl(d.total)}`;
    case 'vendas':return `Venda #${d.numero} · ${parcNome(d.parceiroId)} · ${brl(d.total)}`;
    case 'titulos':return `${d.lado==='pagar'?'Conta a pagar':'Conta a receber'} “${d.descricao}”${d.totalParcelas>1?` ${d.parcela}/${d.totalParcelas}`:''}${d.renova?' (mensal)':''} · ${brl(d.valor)} · venc. ${fd(d.vencimento)}`;
    case 'ajustes':return `${d.sentido==='saida'?'Saída':'Entrada'} de ${fkg(d.kg)} de ${d.tipo} ${d.cor}${d.motivo?' · '+d.motivo:''}`;
    case 'config':return 'Configurações gerais';
  }return '';
}
function acaoTxt(h){
  if(h.acao==='alterou'&&h.col==='titulos'&&h.antes&&h.depois&&!h.antes.pago&&h.depois.pago)return['p-ok',h.depois.lado==='pagar'?'Pagou':'Recebeu'];
  if(h.acao==='alterou'&&h.col==='titulos'&&h.antes?.pago&&!h.depois?.pago)return['p-open','Estornou'];
  return{criou:['p-ok','Criou'],alterou:['p-info','Alterou'],excluiu:['p-late','Excluiu']}[h.acao]||['p-grey',h.acao];
}
function diffHtml(h){
  const a=h.antes||{},d=h.depois||{};
  const keys=[...new Set([...Object.keys(a),...Object.keys(d)])].filter(k=>!SKIP.has(k)&&JSON.stringify(a[k])!==JSON.stringify(d[k]));
  if(h.acao==='criou')return keys.filter(k=>d[k]!==''&&d[k]!=null).map(k=>`<span class="k">${esc(LBL[k]||k)}</span><span>${esc(fmtVal(k,d[k]))}</span>`).join('');
  if(h.acao==='excluiu')return Object.keys(a).filter(k=>!SKIP.has(k)&&a[k]!==''&&a[k]!=null).map(k=>`<span class="k">${esc(LBL[k]||k)}</span><span><del>${esc(fmtVal(k,a[k]))}</del></span>`).join('');
  return keys.map(k=>`<span class="k">${esc(LBL[k]||k)}</span><span><del>${esc(fmtVal(k,a[k]))}</del> → <ins>${esc(fmtVal(k,d[k]))}</ins></span>`).join('')||'<span class="k">Sem mudança visível</span><span></span>';
}
function histRow(h,compact){
  const[pc,pl]=acaoTxt(h);const dt=new Date(h.quando);const open=UI.histOpen.has(h.hid);
  return `<tr><td class="num" style="white-space:nowrap">${dt.toLocaleDateString('pt-BR')}<div class="muted" style="font-size:12.5px">${dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div></td>

      ${h.acao==='excluiu'&&h.antes&&!byId(h.col,h.id)?`<div><button class="btn sm" style="margin-top:6px" data-act="histRestaurar" data-id="${h.hid}">Restaurar</button></div>`:''}</td></tr>`;

function modal(title,body,{wide=false,submit='Salvar',onSubmit,onMount,extra=''}={}){

  const form=root.querySelector('form');
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',kd);modalClose=null};
  const kd=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',kd);modalClose=close;
  root.querySelectorAll('[data-x]').forEach(b=>b.onclick=close);
  root.querySelector('.ov').addEventListener('mousedown',e=>{if(e.target.classList.contains('ov'))close()});
  form.onsubmit=async e=>{e.preventDefault();const err=$('#mErr');err.hidden=true;
    const btn=form.querySelector('[type=submit]');if(btn)btn.disabled=true;
    try{const r=await onSubmit(form);if(r===false){if(btn)btn.disabled=false;return}close();}
    catch(ex){err.textContent=typeof ex==='string'?ex:('Não foi possível salvar: '+(ex?.message||ex));err.hidden=false;if(btn)btn.disabled=false}};
  if(onMount)onMount(form);
  const f=form.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select');if(f&&!('ontouchstart' in window))f.focus();
  return form;
}
function ask(title,msg,buttons){return new Promise(res=>{
  modal(title,`<p style="margin:0">${msg}</p>`,{submit:'',extra:buttons.map((b,i)=>`<button type="button" class="btn ${b.cls||''}" data-ans="${i}">${b.label}</button>`).join(''),onSubmit:()=>{}});
  $('#modalRoot').querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{const v=buttons[+b.dataset.ans].v;modalClose&&modalClose();res(v)});
  $('#modalRoot').querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>res(null)));
})}

  for(const m of S.movimentos.filter(m=>m.ref?.id===t.id))await del('movimentos',m.id);
  const {pago,pagoEm,valorPago,movimentoId,contaId,restoId,valorOriginal,...rest}=t;
  // estorno de pagamento parcial: junta de volta com o saldo que ficou em aberto
  const resto=restoId&&byId('titulos',restoId);
  if(resto&&!resto.pago){await del('titulos',resto.id);await put('titulos',{...rest,valor:r2(num(t.valor)+num(resto.valor)),pago:false})}
  else await put('titulos',{...rest,...(resto?{restoId,valorOriginal}:{}),pago:false});
  toast('Estornado');
}
async function delTitulo(id){
  const t=byId('titulos',id);const futuros=S.titulos.filter(o=>o.grupo===t.grupo&&o.id!==t.id&&!o.pago&&o.vencimento>=t.vencimento);
  if(t.ref){const src=byId(t.ref.col,t.ref.id);if(src){await ask('Lançamento vinculado',`Esta parcela foi gerada pela ${t.ref.col==='compras'?'compra':'venda'} #${src.numero}. Para alterar, edite ou exclua a ${t.ref.col==='compras'?'compra':'venda'}.`,[]);return}}
  const btns=[{label:'Excluir só este',cls:'danger',v:'one'}];if(futuros.length)btns.push({label:`Este e os próximos ${futuros.length} em aberto${t.renova?' (para de renovar)':''}`,cls:'danger',v:'all'});
  const r=await ask('Excluir lançamento',`Excluir <b>${esc(t.descricao)}</b> com vencimento em ${fd(t.vencimento)}?${t.pago?' O pagamento/recebimento registrado no caixa também será removido.':''}`,btns);
  if(!r)return;
  const alvo=r==='all'?[t,...futuros]:[t];
  // excluir a última (ou "este e os próximos") encerra a renovação automática do grupo
  if(t.renova&&(r==='all'||!S.titulos.some(o=>o.grupo===t.grupo&&o.parcela>t.parcela))){for(const o of S.titulos.filter(o=>o.grupo===t.grupo&&o.renova&&!alvo.includes(o)))await put('titulos',{...o,renova:false})}
  for(const x of alvo){for(const m of S.movimentos.filter(m=>m.ref?.id===x.id))await del('movimentos',m.id);await del('titulos',x.id)}
  toast(alvo.length>1?`${alvo.length} lançamentos excluídos`:'Lançamento excluído');
}

      <label class="fl">${i?'':'Valor (R$)'}<input data-pk="valor" data-pgauto inputmode="decimal" value="${esc(x.valor)}" aria-label="Valor"></label><button style="margin-bottom:4px" type="button" class="btn sm danger" data-pgrm="${i}" ${pags.length<2?'disabled':''} aria-label="Remover conta">×</button></div>`).join('');pgInfo()};
    $('#pgRows').addEventListener('input',e=>{const r=e.target.closest('[data-pg]');if(r){pags[+r.dataset.pg][e.target.dataset.pk]=e.target.value;pgInfo()}});
    $('#pgRows').addEventListener('change',e=>{const r=e.target.closest('[data-pg]');if(r)pags[+r.dataset.pg][e.target.dataset.pk]=e.target.value});
    $('#pgRows').addEventListener('click',e=>{const b=e.target.closest('[data-pgrm]');if(b){pags.splice(+b.dataset.pgrm,1);drawPg()}});
    $('#addPg').onclick=()=>{const usadas=new Set(pags.map(x=>x.contaId));      pags.push({contaId:(S.contas.find(c=>c.ativo!==false&&!usadas.has(c.id))||S.contas[0])?.id||'',valor:''});drawPg()};
    f.__pags=()=>pags;f.__alvo=alvo;
    const fp=()=>{const v=f.elements.forma.value;$('#fpConta').hidden=!(v==='dinheiro'||v==='pix'||(v==='credito'&&num(fv(f,'entrada'))>0));$('#fpCred').hidden=v!=='credito';$('#fpPerm').hidden=v!=='permuta'};
    f.querySelectorAll('[name=forma]').forEach(r=>r.addEventListener('change',()=>{fp();const d=defaultConta(f.elements.forma.value);if(d&&!id&&pags.length===1){pags[0].contaId=d;drawPg()}pgInfo()}));
    $('#oParcelas').addEventListener('input',credPrev);$('#oEntrada').addEventListener('input',()=>{credPrev();fp();pgInfo()});$('#oVenc').addEventListener('change',credPrev);
    $('#oParc').addEventListener('change',e=>{$('#novoParc').hidden=e.target.value!=='__novo'});
    fp();drawRows();drawPg();
  },onSubmit:async f=>{
    let parceiroId=fv(f,'parceiroId');
    if(!parceiroId)throw`Selecione o ${isC?'fornecedor':'cliente'}.`;
    const its=itens.map(i=>({tipo:i.tipo,cor:i.cor,embalagem:i.embalagem,qtd:i.embalagem==='granel'?0:num(i.qtd),pesoUn:i.embalagem==='granel'?0:num(i.pesoUn),kg:r2(num(i.kg)),precoKg:num(i.precoKg)}));
    if(its.some(i=>i.kg<=0))throw'Todo item precisa ter peso maior que zero.';
    if(its.some(i=>i.precoKg<=0)&&f.elements.forma.value!=='permuta')throw'Informe o preço por kg de todos os itens.';
    const forma=f.elements.forma.value;
    const total=r2(its.reduce((a,i)=>a+i.kg*i.precoKg,0)),totalKg=r2(its.reduce((a,i)=>a+i.kg,0));
    let novoParc=null;
    if(parceiroId==='__novo'){const nome=fv(f,'np_nome');if(!nome)throw'Informe o nome do novo cadastro.';parceiroId=nid();
      novoParc={id:parceiroId,nome,pessoa:f.elements.np_pessoa.value,documento:fv(f,'np_documento'),fornecedor:isC,cliente:!isC}}
    // venda acima do estoque: avisa e pede um segundo clique para confirmar
    if(!isC){const falta=faltaEstoque(its,id);const sig=JSON.stringify(its.map(i=>[i.tipo,i.cor,i.kg]));
      if(falta.length&&f.dataset.semEstoque!==sig){f.dataset.semEstoque=sig;const btn=f.querySelector('[type=submit]');if(btn)btn.textContent='Vender mesmo assim';
        throw 'Estoque insuficiente: '+falta.map(x=>`${x.tipo} ${x.cor} tem ${fkg(x.tem)} e a venda pede ${fkg(x.pede)}`).join('; ')+'. Confira o material ou clique em “Vender mesmo assim”.'}}
    const opId=id||nid();const data=fv(f,'data')||today();
    const parcelas=forma==='credito'?Math.max(1,Math.min(60,parseInt(fv(f,'parcelas'))||1)):0;
    const primeiroVenc=forma==='credito'?(fv(f,'primeiroVenc')||today()):'';
    // a prazo pode ter entrada à vista; o resto vira parcelas
    const entrada=forma==='credito'?r2(num(fv(f,'entrada'))):0;
    if(entrada<0||(forma==='credito'&&entrada>=total-0.005&&total>0))throw'A entrada precisa ser menor que o total. Se foi tudo à vista, escolha Dinheiro ou PIX.';
    const usaConta=forma==='dinheiro'||forma==='pix'||entrada>0;
    const valorCaixa=forma==='dinheiro'||forma==='pix'?total:entrada;
    let pagamentos=[];
    if(usaConta){const ps=f.__pags();if(ps.some(x=>!x.contaId))throw'Cadastre uma conta de saldo para registrar o pagamento.';
      const vazios=ps.filter(x=>x.valor==='');if(vazios.length>1)throw'Informe o valor de cada conta (pode deixar só uma em branco para ficar com o restante).';
      const soma=r2(ps.reduce((a,x)=>a+num(x.valor),0));
      pagamentos=ps.map(x=>({contaId:x.contaId,valor:x.valor===''?r2(valorCaixa-soma):r2(num(x.valor))}));
      if(pagamentos.some(x=>x.valor<=0))throw'Cada conta precisa ter valor maior que zero.';
      const tot=r2(pagamentos.reduce((a,x)=>a+x.valor,0));
      if(Math.abs(tot-valorCaixa)>0.005)throw`A soma das contas (${brl(tot)}) precisa ser igual ${forma==='credito'?'à entrada':'ao total'} (${brl(valorCaixa)}).`;
      // mesma conta repetida vira uma linha só
      const m=new Map();pagamentos.forEach(x=>m.set(x.contaId,r2((m.get(x.contaId)||0)+x.valor)));pagamentos=[...m].map(([contaId,valor])=>({contaId,valor}))}
    const contaId=pagamentos[0]?.contaId||'';
    const aPrazo=forma==='credito'?r2(total-entrada):0;
    const lado=isC?'pagar':'receber',categoria=isC?'Compra de material':'Venda de material';
    // edição: decide o que fazer com as parcelas já existentes, sem perder baixas
    let plano='novo';const lk=id?linked(id):{tit:[],mov:[]};const pagos=lk.tit.filter(t=>t.pago);
    if(id&&pagos.length){
      if(o.forma!=='credito'||forma!=='credito')throw`Esta ${isC?'compra':'venda'} tem parcelas já ${isC?'pagas':'recebidas'}. Estorne-as em Contas a ${lado} antes de mudar a forma de pagamento.`;
      const pagoSoma=r2(pagos.reduce((a,t)=>a+num(t.valor),0));
      if(r2(num(o.total)-num(o.entrada))===aPrazo&&num(o.parcelas)===parcelas&&o.primeiroVenc===primeiroVenc)plano='manter';
      else{if(aPrazo<pagoSoma-0.005)throw`Já foram ${isC?'pagos':'recebidos'} ${brl(pagoSoma)} em parcelas, mais que o novo valor a prazo de ${brl(aPrazo)}. Estorne alguma parcela antes.`;
        if(aPrazo-pagoSoma>0.005&&parcelas<=pagos.length)throw`${pagos.length} parcela(s) já ${isC?'paga(s)':'recebida(s)'}. Use mais de ${pagos.length} parcelas para o valor que falta.`;
        plano='refazerAbertas'}}
    if(novoParc)await put('parceiros',novoParc);
    else{const p=byId('parceiros',parceiroId);if(p&&!(isC?p.fornecedor:p.cliente))await put('parceiros',{...p,[isC?'fornecedor':'cliente']:true})}
    const numero=id?o.numero:await proximoNumero(col);
    const rec={...o,id:opId,numero,data,parceiroId,itens:its,total,totalKg,forma,contaId,pagamentos,entrada,parcelas,primeiroVenc,permutaDesc:forma==='permuta'?fv(f,'permutaDesc'):'',obs:fv(f,'obs'),criadoEm:o.criadoEm||Date.now()};
    await put(col,rec);
    const pn=parcNome(parceiroId)!=='—'?parcNome(parceiroId):(novoParc?.nome||'');
    const desc=`${isC?'Compra':'Venda'} #${numero} · ${pn}`;
    const novasParcelas=(n,valor,venc,ini,tot,grupo)=>genTitulos({lado,descricao:desc,parceiroId,categoria,natureza:isC?'variavel':'',ref:{col,id:opId},criadoEm:Date.now()},'parcelada',n,valor,venc).map((x,i)=>({...x,parcela:ini+i,totalParcelas:tot,grupo:grupo||x.grupo}));
    // parcelas
    if(plano==='manter'){for(const t of lk.tit)if(t.descricao!==desc||t.parceiroId!==parceiroId)await put('titulos',{...t,descricao:desc,parceiroId})}
    else if(plano==='refazerAbertas'){
      for(const t of lk.tit.filter(t=>!t.pago))await del('titulos',t.id);
      const ord=pagos.slice().sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
      for(const [i,t] of ord.entries())await put('titulos',{...t,parcela:i+1,totalParcelas:parcelas,descricao:desc,parceiroId});
      const resta=r2(aPrazo-ord.reduce((a,t)=>a+num(t.valor),0));
      if(resta>0.005)for(const x of novasParcelas(parcelas-ord.length,resta,addMonths(primeiroVenc,ord.length),ord.length+1,parcelas,ord[0]?.grupo))await put('titulos',x)}
    else{for(const t of lk.tit)await del('titulos',t.id);
      if(forma==='credito'&&aPrazo>0)for(const x of novasParcelas(parcelas,aPrazo,primeiroVenc,1,parcelas))await put('titulos',x)}
    // lançamento de caixa da própria operação (à vista ou entrada): atualiza no lugar
    const proprios=S.movimentos.filter(m=>m.ref?.col===col&&m.ref.id===opId);
    // um lançamento por conta; reaproveita os existentes na edição
    for(const [i,pg] of pagamentos.entries()){const m0=proprios[i];

function relDados(){

  const mat=new Map(),cli=new Map(),forn=new Map(),desp=new Map(),rec=new Map();
  let receita=0,custo=0,semCusto=false;
  vendas.forEach(v=>{const m=margemVenda(v,cm);receita+=num(v.total);custo+=m.custo;semCusto=semCusto||m.semCusto;
    const c=cli.get(v.parceiroId)||{n:0,kg:0,total:0,margem:0};c.n++;c.kg+=num(v.totalKg);c.total+=num(v.total);c.margem+=m.margem;cli.set(v.parceiroId,c);
    (v.itens||[]).forEach(it=>{const k=it.tipo+'|'+it.cor;const ck=cm.get(k)||0;const e=mat.get(k)||{tipo:it.tipo,cor:it.cor,kg:0,receita:0,custo:0};
      e.kg+=num(it.kg);e.receita+=num(it.kg)*num(it.precoKg);e.custo+=num(it.kg)*ck;mat.set(k,e)})});
  compras.forEach(c=>{const e=forn.get(c.parceiroId)||{n:0,kg:0,total:0};e.n++;e.kg+=num(c.totalKg);e.total+=num(c.total);forn.set(c.parceiroId,e)});
  // despesas e outras receitas pelo caixa (compra e venda de material ficam de fora: já entram pelo custo e pelas vendas)
  S.movimentos.filter(dentro).forEach(m=>{if(m.tipo==='saida'&&m.categoria!=='Compra de material'){const k=m.categoria||'Sem categoria';desp.set(k,(desp.get(k)||0)+num(m.valor))}

  const despT=[...desp.values()].reduce((a,v)=>a+v,0),recT=[...rec.values()].reduce((a,v)=>a+v,0);
  if(UI.per==='ano')label=UI.mes.slice(0,4);
  return{label,ini,fim,vendas,compras,receita:r2(receita),custo:r2(custo),margem:r2(receita-custo),semCusto,despT:r2(despT),recT:r2(recT),resultado:r2(receita-custo+recT-despT),
    mat:[...mat.values()].map(e=>({...e,margem:e.receita-e.custo})).sort((a,b)=>b.receita-a.receita),
    cli:[...cli].map(([id,e])=>({nome:parcNome(id),...e})).sort((a,b)=>b.total-a.total),
    forn:[...forn].map(([id,e])=>({nome:parcNome(id),...e})).sort((a,b)=>b.total-a.total),
    desp:[...desp].sort((a,b)=>b[1]-a[1]),rec:[...rec].sort((a,b)=>b[1]-a[1])};
}

    ['Contas de saldo',[['Nome','Tipo','Detalhe','Saldo inicial','Saldo atual','Ativa']].concat(S.contas.map(c=>[c.nome,TIPOCONTA[c.tipo],c.detalhe||'',n(c.saldoInicial),saldoConta(c.id),c.ativo===false?'Não':'Sim']))],
    ['Caixa',[['Data','Tipo','Descrição','Categoria','Conta','Conta destino','Cliente/fornecedor','Valor']].concat(S.movimentos.slice().sort((a,b)=>a.data.localeCompare(b.data)).map(m=>[fd(m.data),{entrada:'Entrada',saida:'Saída',transferencia:'Transferência'}[m.tipo],m.descricao,m.categoria||'',contaNome(m.contaId),m.contaDestinoId?contaNome(m.contaDestinoId):'',m.parceiroId?parcNome(m.parceiroId):'',n(m.valor)]))],
    ['Contas a pagar e receber',[['Lado','Vencimento','Descrição','Cliente/fornecedor','Categoria','Parcela','Valor','Situação','Pago em','Valor pago']].concat(S.titulos.slice().sort((a,b)=>a.vencimento.localeCompare(b.vencimento)).map(t=>[t.lado==='pagar'?'A pagar':'A receber',fd(t.vencimento),t.descricao,t.parceiroId?parcNome(t.parceiroId):'',t.categoria||'',t.totalParcelas>1?t.parcela+'/'+t.totalParcelas:'',n(t.valor),statusT(t),t.pago?fd(t.pagoEm):'',t.pago?n(t.valorPago):'']))],
    ...['compras','vendas'].map(col=>[col==='compras'?'Compras':'Vendas',[['Nº','Data',col==='compras'?'Fornecedor':'Cliente','Material','Cor','Embalagem','Qtd','Peso emb. (kg)','Peso (kg)','R$/kg','Subtotal','Total da operação','Pagamento']].concat(S[col].slice().sort((a,b)=>a.data.localeCompare(b.data)).flatMap(o=>(o.itens||[]).map(i=>[o.numero,fd(o.data),parcNome(o.parceiroId),i.tipo,i.cor,EMB[i.embalagem],n(i.qtd),n(i.pesoUn),n(i.kg),num(i.precoKg),n(num(i.kg)*num(i.precoKg)),n(o.total),FORMA[o.forma]])))]),
    ['Estoque',[['Material','Cor','Embalagem','Peso emb. (kg)','Qtd embalagens','Peso total (kg)','Custo médio/kg','Valor']].concat(estoque().filter(e=>Math.abs(e.kg)>0.0001).map(e=>[e.tipo,e.cor,EMB[e.embalagem],e.pesoUn,e.un,n(e.kg),n(e.custoKg),n(e.valor)]))],
    ['Ajustes de estoque',[['Data','Sentido','Material','Cor','Embalagem','Peso (kg)','Custo/kg','Motivo']].concat(S.ajustes.map(a=>[fd(a.data),a.sentido==='saida'?'Saída':'Entrada',a.tipo,a.cor,EMB[a.embalagem],n(a.kg),num(a.custoKg),a.motivo||'']))],
    ['Clientes e fornecedores',[['Nome','Pessoa','CPF/CNPJ','Telefone','E-mail','Cidade','UF','Endereço','Fornecedor','Cliente','Observações']].concat(S.parceiros.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>[p.nome,p.pessoa,p.documento||'',p.telefone||'',p.email||'',p.cidade||'',p.uf||'',p.endereco||'',p.fornecedor?'Sim':'',p.cliente?'Sim':'',p.obs||'']))]];
  const a=document.createElement('a');a.href=URL.createObjectURL(xlsx(sh));a.download='backup-3struza-'+today()+'.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},0);
}
function baixarBackupJSON(){const o={geradoEm:new Date().toISOString()};COLS.forEach(c=>o[c]=S[c]);baixarArquivo(JSON.stringify(o,null,1),'backup-3struza-'+today()+'.json','application/json')}

/* ===================== eventos ===================== */
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();if(modalClose)modalClose();go(g.dataset.go);return}
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  const a=b.dataset.act,id=b.dataset.id;
  try{switch(a){
    case 'mes':UI.mes=addMonths(UI.mes+'-01',+b.dataset.d).slice(0,7);render();break;
    case 'novaConta':formConta();break;case 'editConta':formConta(id);break;
    case 'mov':formMov(b.dataset.t);break;case 'transf':formMov('transferencia');break;
    case 'editMov':formMov(null,id);break;
    case 'delMov':{const m=byId('movimentos',id);
      if(m.ref){const src=m.ref.col==='titulos'?byId('titulos',m.ref.id):byId(m.ref.col,m.ref.id);
        if(m.ref.col==='titulos'&&src){await estornar(src.id);break}
        if(src){await ask('Lançamento vinculado',`Este lançamento veio da ${m.ref.col==='compras'?'compra':'venda'} #${src.numero}. Para removê-lo, edite ou exclua a ${m.ref.col==='compras'?'compra':'venda'}.`,[]);break}}
      if(await ask('Excluir movimentação',`Excluir <b>${esc(m.descricao)}</b> de ${brl(m.valor)}?`,[{label:'Excluir',cls:'danger',v:true}])){await del('movimentos',id);toast('Excluído')}break}
    case 'filtroConta':UI.filtroConta=UI.filtroConta===id?'':id;render();break;
    case 'per':UI.per=b.dataset.v;render();break;
    case 'csv':baixarCSV();break;
    case 'csvTit':csvTit(b.dataset.lado);break;case 'csvRel':csvRel(b.dataset.k);break;case 'recibo':recibo(b.dataset.col,id);break;
    case 'backup':baixarBackup();break;case 'backupJson':baixarBackupJSON();break;
    case 'caixaMais':UI.caixaLim=(UI.caixaLim||200)+500;render();break;
    case 'filtroT':UI.filtroT=b.dataset.v;render();break;
    case 'cadFiltro':UI.cadFiltro=b.dataset.v;render();break;
    case 'novoTitulo':formTitulo(b.dataset.lado);break;case 'editTitulo':formTitulo(null,id);break;
    case 'baixar':formBaixa(id);break;case 'estornar':await estornar(id);break;case 'delTitulo':await delTitulo(id);break;
    case 'novaCompra':formOp('compras');break;case 'novaVenda':formOp('vendas');break;
    case 'editOp':formOp(b.dataset.col,id);break;case 'delOp':await delOp(b.dataset.col,id);break;
    case 'novoParc':formParc();break;case 'editParc':if(modalClose)modalClose();formParc(id);break;case 'verParc':verParc(id);break;
    case 'delParc':{const p=byId('parceiros',id);const usado=['compras','vendas','titulos','movimentos'].some(c=>S[c].some(x=>x.parceiroId===id));
      if(usado){await ask('Cadastro em uso',`<b>${esc(p.nome)}</b> tem compras, vendas, contas ou lançamentos de caixa vinculados e não pode ser excluído.`,[]);break}
      if(await ask('Excluir cadastro',`Excluir <b>${esc(p.nome)}</b>?`,[{label:'Excluir',cls:'danger',v:true}])){await del('parceiros',id);toast('Cadastro excluído')}break}
    case 'ajuste':formAjuste();break;
    case 'hist':verHist(b.dataset.col,id);break;
    case 'histMais':loadHist(false);break;
    case 'histRestaurar':{const h=HIST.rows.find(x=>x.hid===+id);if(!h||!h.antes)break;
      if(!await ask('Restaurar registro',`Recriar “${esc(descReg(h.col,h.antes))}” como estava antes de ser excluído?`+(h.col==='compras'||h.col==='vendas'?' As parcelas e lançamentos de caixa ligados a ela aparecem no histórico e podem ser restaurados um a um.':''),[{label:'Restaurar',cls:'pri',v:true}]))break;
      await put(h.col,{...h.antes,id:h.id});toast('Registro restaurado');break}
    case 'histToggle':UI.histOpen.has(+id)?UI.histOpen.delete(+id):UI.histOpen.add(+id);render();break;
    case 'histPer':UI.histPer=b.dataset.v;loadHist(true);break;
    case 'dispensar':(UI.dispensados||(UI.dispensados=new Set())).add(id);render();break;
    case 'delAjuste':if(await ask('Excluir ajuste','Excluir este ajuste de estoque?',[{label:'Excluir',cls:'danger',v:true}])){await del('ajustes',id);toast('Ajuste excluído')}break;
    case 'cfgRen':{const k=b.dataset.k,i=+b.dataset.i,old=cfg()[k][i];
      modal('Renomear',`<label class="fl">Novo nome para “${esc(old)}”<input name="v" value="${esc(old)}" required></label>`,{submit:'Renomear',onSubmit:async f=>{
        const v=fv(f,'v');if(!v)throw'Informe o nome.';if(v===old)return;const l=cfg()[k].slice();if(l.includes(v))throw'Esse nome já existe na lista.';
        l[i]=v;await saveCfg({[k]:l});
        const campo=k==='tipos'?'tipo':k==='cores'?'cor':'categoria';let n=0;
        if(campo==='categoria'){for(const col of ['movimentos','titulos'])for(const x of S[col].filter(x=>x.categoria===old)){await put(col,{...x,categoria:v});n++}}
        else{for(const col of ['compras','vendas'])for(const x of S[col].filter(x=>(x.itens||[]).some(it=>it[campo]===old))){await put(col,{...x,itens:x.itens.map(it=>it[campo]===old?{...it,[campo]:v}:it)});n++}
          for(const x of S.ajustes.filter(x=>x[campo]===old)){await put('ajustes',{...x,[campo]:v});n++}
          if(UI.estCor===old)UI.estCor=v;if(UI.estTipo===old)UI.estTipo=v}
        toast(`Renomeado${n?` · ${n} lançamento(s) atualizado(s)`:''}`)}});break}
    case 'cfgDel':{const k=b.dataset.k;const l=cfg()[k].slice();l.splice(+b.dataset.i,1);await saveCfg({[k]:l});break}
    case 'limparEx':{if(!await ask('Remover dados de exemplo','Todos os registros marcados como exemplo serão apagados. Os dados que você lançou continuam.',[{label:'Remover exemplos',cls:'danger',v:true}]))break;
      const usados=new Set();['movimentos','compras','vendas','titulos'].forEach(c=>S[c].filter(x=>!x.exemplo).forEach(x=>[x.contaId,x.contaDestinoId,x.parceiroId].forEach(v=>v&&usados.add(v))));
      let n=0,k=0;for(const col of COLS)for(const x of S[col].filter(x=>x.exemplo)){if((col==='contas'||col==='parceiros')&&usados.has(x.id)){await put(col,x);k++;continue}await del(col,x.id);n++}
      toast(n+' registros removidos'+(k?`, ${k} mantidos por estarem em uso`:''));break}
  }}catch(ex){console.error(ex);toast('Erro: '+(ex?.message||ex?.code||ex))}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.nav a')){e.target.click()}});
document.addEventListener('change',e=>{const a=e.target.dataset?.act;
  if(a==='histUser'){UI.histUser=e.target.value;loadHist(true)}
  if(a==='histCol'){UI.histCol=e.target.value;loadHist(true)}
  if(a==='fConta'){UI.filtroConta=e.target.value;render()}
  if(a==='estTipo'){UI.estTipo=e.target.value;render()}
  if(a==='estCor'){UI.estCor=e.target.value;render()}
  if(a==='estZero'){UI.estZero=e.target.checked;render()}});
let bt=null;document.addEventListener('input',e=>{if(e.target.id==='busca'){UI.busca=e.target.value;clearTimeout(bt);bt=setTimeout(render,180)}});
document.addEventListener('submit',async e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  try{if(f.dataset.form==='cfgAdd'){const k=f.dataset.k;const v=f.elements.v.value.trim();if(!v)return;const l=cfg()[k];if(l.includes(v)){toast('Já existe');return}await saveCfg({[k]:[...l,v]});toast('Adicionado')}
  if(f.dataset.form==='cfgPesos'){await saveCfg({pesoSaco:num(f.elements.pesoSaco.value)||25,pesoBag:num(f.elements.pesoBag.value)||1000});toast('Pesos salvos')}}catch(ex){toast('Erro: '+(ex?.message||ex))}});

/* ===================== boot ===================== */
(function(){const h=(location.hash||'').slice(1);if(TITLES[h])UI.view=h})();
renderNav();
(function(){const d=new Date();const s=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});$('#today').textContent=s.charAt(0).toUpperCase()+s.slice(1)})();
if(!window.SUPA_CFG)(async function(){let u=null;try{if(window.claude&&typeof window.claude.use==='function')u=await window.claude.use('user')}catch(e){}
  if(!u){$('#urole').textContent='Modo local';return}
  try{const me=await u.me();const nome=(me&&me.name)||'';const first=nome.split(' ')[0];
    if(first){$('#hello').textContent='Olá, '+first+'!';$('#uname').textContent=nome;$('#av').textContent=first.charAt(0).toUpperCase()}
    const adm=await u.canEdit();$('#urole').textContent=adm?'Administrador':'Colaborador'}catch(e){$('#urole').textContent=''}})();
if(window.SUPA_CFG)initSupa();else initStore();
</script>
