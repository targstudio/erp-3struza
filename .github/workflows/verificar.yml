name: Verificar

# Roda os testes e confere se o index.html publicado foi gerado a partir do código em src/.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: index.html atualizado
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::O index.html não corresponde ao código em src/. Rode 'npm run build' e faça commit do index.html."
            exit 1
          fi
